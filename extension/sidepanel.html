<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>WebMods</title>
<link rel="stylesheet" href="sidepanel.css">
<link rel="stylesheet" href="switch.css">
</head>
<body>
<header class="bar">
  <span id="dot" class="dot" role="img" aria-label="Status unknown"></span>
  <h1 id="site" class="site">WebMods</h1>
  <button id="site-switch" class="switch" type="button" role="switch" aria-checked="false" hidden><span class="knob" aria-hidden="true"></span></button>
  <button id="new-chat" class="icon-btn" type="button" title="New chat" aria-label="New chat" disabled>
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
  </button>
  <button id="settings-btn" class="icon-btn" type="button" title="Settings" aria-label="Settings" aria-expanded="false" aria-controls="settings">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.78 3.25L7.19 1.55L8.81 1.55L9.22 3.25A4.9 4.9 0 0 1 10.49 3.78L11.98 2.86L13.14 4.02L12.22 5.51A4.9 4.9 0 0 1 12.75 6.78L14.45 7.19L14.45 8.81L12.75 9.22A4.9 4.9 0 0 1 12.22 10.49L13.14 11.98L11.98 13.14L10.49 12.22A4.9 4.9 0 0 1 9.22 12.75L8.81 14.45L7.19 14.45L6.78 12.75A4.9 4.9 0 0 1 5.51 12.22L4.02 13.14L2.86 11.98L3.78 10.49A4.9 4.9 0 0 1 3.25 9.22L1.55 8.81L1.55 7.19L3.25 6.78A4.9 4.9 0 0 1 3.78 5.51L2.86 4.02L4.02 2.86L5.51 3.78A4.9 4.9 0 0 1 6.78 3.25Z"/><circle cx="8" cy="8" r="2"/></svg>
  </button>
</header>

<section id="settings" class="settings" hidden>
  <label class="field">
    <span>Agent</span>
    <select id="agent"><option value="">Default</option></select>
  </label>
  <p id="agent-note" class="note" hidden></p>
  <label class="field">
    <span>Model</span>
    <input id="model" type="text" list="model-options" placeholder="Agent default" autocomplete="off" spellcheck="false">
    <datalist id="model-options"><option value="opus"><option value="sonnet"><option value="haiku"></datalist>
  </label>
  <label class="field field-stacked">
    <span>Instructions for your agent</span>
    <textarea id="instructions" rows="3" maxlength="4000" spellcheck="true" disabled
      placeholder="Read by every chat. For example: talk like a caveman; don't bring up detectability."></textarea>
  </label>
  <p id="instructions-note" class="note">Applies from your next message, here and in Claude Code in ~/.webmods.</p>
  <p class="note"><a href="#" id="setup-link">Setup and status</a></p>
</section>

<section id="gate" class="gate" hidden>
  <p class="gate-title">WebMods is disabled</p>
  <p id="gate-note" class="note"></p>
  <button id="gate-btn" class="btn go" type="button"></button>
</section>

<section id="notice" class="notice" hidden></section>

<details id="mods" class="mods" hidden>
  <summary>Mods on this site <span id="mods-count" class="count"></span></summary>
  <ul id="mod-list" class="mod-list"></ul>
</details>

<main id="chat" class="chat">
  <div id="empty" class="empty" hidden>
    <p class="empty-lead">Describe a change and your coding agent will write a mod that runs every time this site loads.</p>
    <div class="chips">
      <button type="button" class="chip">Hide distractions</button>
      <button type="button" class="chip">Make it dark</button>
      <button type="button" class="chip">Wider layout</button>
    </div>
  </div>
  <ol id="messages" class="messages" aria-live="polite" aria-relevant="additions"></ol>
  <div id="working" class="working" hidden role="status"><span class="pulse" aria-hidden="true"></span>Working…</div>
</main>

<form id="composer" class="composer">
  <label for="input" class="visually-hidden">Message</label>
  <textarea id="input" rows="1" placeholder="What would you like to change?"></textarea>
  <button id="send" class="send" type="submit" title="Send" aria-label="Send">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5"/></svg>
  </button>
  <button id="stop" class="send stop" type="button" title="Stop" aria-label="Stop" hidden>
    <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.5"/></svg>
  </button>
</form>

<script type="module" src="sidepanel.js"></script>
</body>
</html>
