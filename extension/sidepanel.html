<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Tim's Robot Internet Fixer</title>
<link rel="icon" href="icons/robot-32.png">
<link rel="stylesheet" href="sidepanel.css">
<link rel="stylesheet" href="switch.css">
</head>
<body>
<header class="bar">
  <span id="dot" class="dot" role="img" aria-label="Status unknown"></span>
  <h1 id="site" class="site">Tim's Robot Internet Fixer</h1>

4 55.5,55 56.1,56.1 56.5,57.2 56.9,58.5 57.1,59.8 57.3,61.2"/><polygon class="eye" points="95.3,63 95.3,64.8 95.1,66.2 94.9,67.5 94.5,68.8 94.1,69.9 93.5,71 92.9,72 92.1,72.8 91.3,73.6 90.4,74.3 89.4,74.9 88.4,75.4 87.2,75.8 86,76.1 84.6,76.2 83,76.3 81.4,76.2 80,76.1 78.8,75.8 77.6,75.4 76.6,74.9 75.6,74.3 74.7,73.6 73.9,72.8 73.1,72 72.5,71 71.9,69.9 71.5,68.8 71.1,67.5 70.9,66.2 70.7,64.8 70.7,63 70.7,61.2 70.9,59.8 71.1,58.5 71.5,57.2 71.9,56.1 72.5,55 73.1,54 73.9,53.2 74.7,52.4 75.6,51.7 76.6,51.1 77.6,50.6 78.8,50.2 80,49.9 81.4,49.8 83,49.7 84.6,49.8 86,49.9 87.2,50.2 88.4,50.6 89.4,51.1 90.4,51.7 91.3,52.4 92.1,53.2 92.9,54 93.5,55 94.1,56.1 94.5,57.2 94.9,58.5 95.1,59.8 95.3,61.2"/></svg>
  <!-- Right-aligned as a group, whether or not the power button shows. -->
  <div class="bar-actions">
    <button id="site-switch" class="icon-btn power" type="button" role="switch" aria-checked="false" hidden>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.2 4.3a5 5 0 1 0 5.6 0"/><path d="M8 2.2v5"/></svg>
    </button>
    <button id="new-chat" class="icon-btn" type="button" title="New chat" aria-label="New chat" disabled>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
    </button>
    <button id="settings-btn" class="icon-btn" type="button" title="Settings" aria-label="Settings" aria-expanded="false" aria-controls="settings">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.78 3.25L7.19 1.55L8.81 1.55L9.22 3.25A4.9 4.9 0 0 1 10.49 3.78L11.98 2.86L13.14 4.02L12.22 5.51A4.9 4.9 0 0 1 12.75 6.78L14.45 7.19L14.45 8.81L12.75 9.22A4.9 4.9 0 0 1 12.22 10.49L13.14 11.98L11.98 13.14L10.49 12.22A4.9 4.9 0 0 1 9.22 12.75L8.81 14.45L7.19 14.45L6.78 12.75A4.9 4.9 0 0 1 5.51 12.22L4.02 13.14L2.86 11.98L3.78 10.49A4.9 4.9 0 0 1 3.25 9.22L1.55 8.81L1.55 7.19L3.25 6.78A4.9 4.9 0 0 1 3.78 5.51L2.86 4.02L4.02 2.86L5.51 3.78A4.9 4.9 0 0 1 6.78 3.25Z"/><circle cx="8" cy="8" r="2"/></svg>
    </button>
  </div>
</header>

<section id="settings" class="settings" hidden>
  <label class="field">
    <span>Agent</span>
    <select id="agent"><option value="">Default</option></select>
  </label>
  <p id="agent-note" class="note" hidden></p>
  <div id="open-model" class="open-model" hidden>
    <label class="field">
      <span>From</span>
      <select id="om-provider"></select>
    </label>
    <label id="om-url-row" class="field" hidden>
      <span>Server</span>
      <input id="om-url" type="url" placeholder="https://…/v1" autocomplete="off" spellcheck="false" aria-label="Server address">
    </label>
    <div id="om-key-row" class="field" hidden>
      <span>API key</span>
      <div class="om-key">
        <input id="om-key" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your key" aria-label="API key">
        <button id="om-key-save" class="btn" type="button">Save</button>
        <button id="om-key-remove" class="btn" type="button" hidden>Remove</button>
      </div>
    </div>
    <p id="om-key-status" class="note" hidden></p>
    <p id="om-note" class="note" hidden></p>
  </div>
  <label class="field">
    <span>Model</span>
    <select id="model"><option value="">Default</option></select>
  </label>
  <label id="model-custom-row" class="field" hidden>
    <span></span>
    <input id="model-custom" type="text" placeholder="Exact model name" autocomplete="off" spellcheck="false" aria-label="Exact model name">
  </label>
  <p id="model-note" class="note" hidden></p>
  <label class="field field-stacked">
    <span>Instructions for your agent</span>
    <textarea id="instructions" rows="3" maxlength="4000" spellcheck="true" disabled
      placeholder="Read by every chat. For example: talk like a caveman; don't bring up detectability."></textarea>
  </label>
  <p id="instructions-note" class="note">Applies from your next message, here and in Claude Code in ~/.trif.</p>
  <label class="check"><input id="auto-update" type="checkbox"> Install updates automatically</label>
  <p id="update-note" class="note"></p>
  <p class="note"><a href="#" id="report-link">Report a problem</a> · <a href="#" id="setup-link">Setup and status</a></p>
</section>
<section id="gate" class="gate" hidden>
  <!-- The robot (the toolbar icon) with its eyes off. -->
  <svg class="gate-icon" viewBox="0 0 128 128" aria-hidden="true"><polygon class="rim" points="120,64 119.8,75.9 119.3,82.8 118.4,88.6 117.1,93.5 115.5,97.9 113.5,101.8 111.2,105.3 108.4,108.4 105.3,111.2 101.8,113.5 97.9,115.5 93.5,117.1 88.6,118.4 82.8,119.3 75.9,119.8 64,120 52.1,119.8 45.2,119.3 39.4,118.4 34.5,117.1 30.1,115.5 26.2,113.5 22.7,111.2 19.6,108.4 16.8,105.3 14.5,101.8 12.5,97.9 10.9,93.5 9.6,88.6 8.7,82.8 8.2,75.9 8,64 8.2,52.1 8.7,45.2 9.6,39.4 10.9,34.5 12.5,30.1 14.5,26.2 16.8,22.7 19.6,19.6 22.7,16.8 26.2,14.5 30.1,12.5 34.5,10.9 39.4,9.6 45.2,8.7 52.1,8.2 64,8 75.9,8.2 82.8,8.7 88.6,9.6 93.5,10.9 97.9,12.5 101.8,14.5 105.3,16.8 108.4,19.6 111.2,22.7 113.5,26.2 115.5,30.1 117.1,34.5 118.4,39.4 119.3,45.2 119.8,52.1"/><polygon class="face" points="110,64 109.9,73.8 109.4,79.5 108.7,84.2 107.6,88.2 106.3,91.9 104.7,95.1 102.7,98 100.5,100.5 98,102.7 95.1,104.7 91.9,106.3 88.2,107.6 84.2,108.7 79.5,109.4 73.8,109.9 64,110 54.2,109.9 48.5,109.4 43.8,108.7 39.8,107.6 36.1,106.3 32.9,104.7 30,102.7 27.5,100.5 25.3,98 23.3,95.1 21.7,91.9 20.4,88.2 19.3,84.2 18.6,79.5 18.1,73.8 18,64 18.1,54.2 18.6,48.5 19.3,43.8 20.4,39.8 21.7,36.1 23.3,32.9 25.3,30 27.5,27.5 30,25.3 32.9,23.3 36.1,21.7 39.8,20.4 43.8,19.3 48.5,18.6 54.2,18.1 64,18 73.8,18.1 79.5,18.6 84.2,19.3 88.2,20.4 91.9,21.7 95.1,23.3 98,25.3 100.5,27.5 102.7,30 104.7,32.9 106.3,36.1 107.6,39.8 108.7,43.8 109.4,48.5 109.9,54.2"/></svg>
  <p class="gate-title">The robot is off.</p>
  <button id="gate-btn" class="btn go" type="button"></button>
  <p id="gate-err" class="mod-err" hidden></p>
</section>

<!-- No website in this tab: just the robot. -->
<section id="landing" class="landing" hidden>
  <img class="landing-icon" src="icons/robot-shaded.svg" alt="">
</section>

<section id="notice" class="notice" hidden></section>
<section id="update" class="notice" hidden></section>

<details id="mods" class="mods" hidden>
  <summary>Mods on this site <span id="mods-count" class="count"></span></summary>
  <ul id="mod-list" class="mod-list"></ul>
</details>

<main id="chat" class="chat">
  <div id="empty" class="empty" hidden>
    <p class="empty-lead">Tell your coding agent what to fix. It writes a mod that runs every time this site loads.</p>
    <div class="chips">
      <button type="button" class="chip">Hide distractions</button>
      <button type="button" class="chip">Make it dark</button>
      <button type="button" class="chip">Wider layout</button>
    </div>
  </div>
  <ol id="messages" class="messages" aria-live="polite" aria-relevant="additions"></ol>
  <div id="working" class="working" hidden role="status"><span class="pulse" aria-hidden="true"></span>Working…</div>
</main>

<form id="composer" class="composer">
  <label for="input" class="visually-hidden">Message</label>
  <textarea id="input" rows="1" placeholder="What should I fix?"></textarea>
  <button id="send" class="send" type="submit" title="Send" aria-label="Send">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5"/></svg>
  </button>
  <button id="stop" class="send stop" type="button" title="Stop" aria-label="Stop" hidden>
    <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.5"/></svg>
  </button>
</form>

<script type="module" src="sidepanel.js"></script>
</body>
</html>
