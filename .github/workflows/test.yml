# The unit suite on every push and pull request, on macOS (several tests cover macOS-only paths: the Safari
# bridge, APFS case, the keychain stand-ins). Tests that need an installed agent (Claude Code, Codex) skip
# themselves here. Chrome for Testing is installed where the e2e looks for it (tests/e2e/.browsers) for the
# real-browser tests (the sandbox runtime under real SES, the CSS reader, the mobile probes, and their
# helper), driven over CDP by tests/cdp-page.js; they run only with TRIF_BROWSER_TESTS=1 (or CI) set. The
# e2e suite (tests/e2e) needs a desktop session and isn't run here.
name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # (shipped-history.json and the upgrade test read old versions and tags)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chrome for Testing, for the real-browser tests
        run: |
          npx --yes @puppeteer/browsers install chrome@stable --path tests/e2e/.browsers
          node -e "const c = require('./tests/e2e/lib/chrome').findChrome(); if (!c) { console.error('Chrome for Testing not found after installing it'); process.exit(1); } console.log(c)"
      - run: npm test
        env:
          TRIF_BROWSER_TESTS: 1
