# SPIKE (docs/WHOLE-BOX.md), branch whole-box only: the whole agent process in TRIF's own OS sandbox.
# Nothing is published, uploaded or signed; no secrets. Claude Code talks to a stand-in for Anthropic's API
# (no account, no paid call).
name: whole-box

on:
  push:
    branches: [whole-box]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whole-box-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Claude Code (npm's) in TRIF's Seatbelt box on a Mac: the probes, the loosest-settings run, and the
  # full side-panel run with every `trif` command, with and without the box.
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # (the user's own Claude Code: npm's newest, for today's sandbox; boxed runs use TRIF's pin, below)
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude --version; ls -la "$(command -v claude)"; file "$(readlink -f "$(command -v claude)")" || true
      # (step 3: do Seatbelt's reports reach `log stream` here, with and without sudo?)
      - name: Probe Seatbelt's reports in the log
        continue-on-error: true
        run: |
          T="TRIF-box-probe$$"
          printf '(version 1)\n(deny default (with message "%s"))\n(allow process-exec process-fork sysctl-read mach-lookup)\n(allow file-read* (subpath "/usr") (subpath "/System") (subpath "/bin") (subpath "/private/var/db/dyld") (subpath "/dev") (literal "/"))\n' "$T" > "$RUNNER_TEMP/p.sb"
          log stream --style ndjson --predicate "eventMessage CONTAINS \"$T\"" > "$RUNNER_TEMP/s1.txt" 2>&1 &
          sudo log stream --style ndjson --predicate "eventMessage CONTAINS \"$T\"" > "$RUNNER_TEMP/s2.txt" 2>&1 &
          log stream --style compact --predicate 'sender == "Sandbox"' > "$RUNNER_TEMP/s3.txt" 2>&1 &
          sleep 3
          sandbox-exec -f "$RUNNER_TEMP/p.sb" /bin/cat /etc/hosts || true
          sleep 5
          pkill -f "log stream" || true; sudo pkill -f "log stream" || true
          for f in s1 s2 s3; do echo "== $f"; head -c 2000 "$RUNNER_TEMP/$f.txt"; echo; done
          echo "== log show (tag)"; log show --last 1m --style compact --predicate "eventMessage CONTAINS \"$T\"" | head -20
          echo "== log show (Sandbox)"; log show --last 1m --style compact --predicate 'sender == "Sandbox"' | head -20
          sw_vers; id
      - name: TRIF's pinned Claude Code, unit tests (a stand-in registry), and the Settings switch
        run: TRIF_TEST_BOX_REPORTS=1 node --test tests/claudepin.test.js tests/wholebox-setting.test.js tests/claudetoken.test.js tests/wholebox-noshell.test.js tests/wholebox-refusals.test.js
      # TRIF's pinned Claude Code (helper/claude-code.json), installed as the helper does: from the npm
      # registry, its sha512 checked against the pin, Anthropic's signature checked.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/claude-pin
          key: claude-pin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('helper/claude-code.json') }}
      - name: Install TRIF's pinned Claude Code
        run: |
          node helper/lib/claudepin.js ensure "$RUNNER_TEMP/claude-pin"
          ls -la "$RUNNER_TEMP"/claude-pin/runtime/*/
          "$RUNNER_TEMP"/claude-pin/runtime/claude-code-*/claude --version
          echo "TRIF_TEST_CLAUDE_PIN_HOME=$RUNNER_TEMP/claude-pin" >> "$GITHUB_ENV"
      # (step 6b: what the real pinned copy prints for `setup-token` under the pseudo-terminal logins.js uses;
      # never completed, no account: a stand-in code is typed)
      - name: Probe setup-token's output (TRIF's pinned Claude Code)
        continue-on-error: true
        timeout-minutes: 4
        run: node tests/whole-box/setup-token-probe.js "$RUNNER_TEMP/claude-pin"
      - name: The box, and the loosest Claude Code in it
        run: node --test --test-timeout=300000 tests/whole-box.test.js
      - name: A side-panel run, every trif command (today's sandbox)
        run: TRIF_TEST_NO_REAL_CODEX=1 node --test --test-timeout=300000 --test-name-pattern="Claude Code" tests/run-sandbox.test.js
      # (TRIF_WHOLE_BOX=1: the test switches Settings' "Run chats in TRIF's full sandbox" on, config.json "wholeBox")
      - name: The same, the whole process in TRIF's box
        run: TRIF_WHOLE_BOX=1 TRIF_TEST_NO_REAL_CODEX=1 node --test --test-timeout=300000 --test-name-pattern="Claude Code" tests/run-sandbox.test.js
      # An organization's managed settings, for real (the runner's own /Library, with sudo; never anyone's
      # computer): Claude Code reads them whatever TRIF passes. The box must hold under them.
      - name: Managed settings that loosen everything, and the box
        run: |
          sudo mkdir -p "/Library/Application Support/ClaudeCode"
          echo '{"permissions":{"allow":["Read(//**)","Edit(//**)","Write(//**)","Bash(*)","Glob","Grep"],"defaultMode":"bypassPermissions","additionalDirectories":["/"]},"sandbox":{"enabled":false}}' | sudo tee "/Library/Application Support/ClaudeCode/managed-settings.json"
          TRIF_TEST_MANAGED=loosen node --test --test-timeout=300000 tests/whole-box.test.js
      # (step 7a: those settings let a run use any command, so a side-panel run in the box gets no shell, the
      # trif tool; and nobody is asked "Use Claude Code anyway": the box holds them)
      - name: The same settings, a side-panel run in TRIF's box, not asked, no shell
        run: TRIF_WHOLE_BOX=1 TRIF_TEST_MANAGED=loosen TRIF_TEST_NO_REAL_CODEX=1 node --test --test-timeout=300000 --test-name-pattern="no shell" tests/run-sandbox.test.js
      - name: Managed settings that only loosen Claude Code's rules (no other commands), a side-panel run in TRIF's box with a shell, not asked
        run: |
          echo '{"permissions":{"allow":["Read(//**)","Edit(//**)","Write(//**)","Glob","Grep"],"defaultMode":"acceptEdits","additionalDirectories":["/"]},"sandbox":{"enabled":false}}' | sudo tee "/Library/Application Support/ClaudeCode/managed-settings.json"
          TRIF_WHOLE_BOX=1 TRIF_TEST_MANAGED=loosen-shell TRIF_TEST_NO_REAL_CODEX=1 node --test --test-timeout=300000 --test-name-pattern="only loosen" tests/run-sandbox.test.js
      # (step 3b: a run the box makes fail for real, the error naming what it refused: settings that send
      # Claude Code to a host of the organization's, here TEST-NET 192.0.2.1, which the box doesn't let it reach)
      - name: Managed settings sending Claude Code to another host, a side-panel run in TRIF's box that fails, the error naming it
        run: |
          echo '{"env":{"ANTHROPIC_BASE_URL":"http://192.0.2.1:80","CLAUDE_CODE_MAX_RETRIES":"0"}}' | sudo tee "/Library/Application Support/ClaudeCode/managed-settings.json"
          TRIF_WHOLE_BOX=1 TRIF_TEST_MANAGED=gateway TRIF_TEST_NO_REAL_CODEX=1 node --test --test-timeout=300000 --test-name-pattern="LLM gateway" tests/run-sandbox.test.js
      - name: Managed settings that force Claude Code's own sandbox on, and the box
        run: |
          echo '{"sandbox":{"enabled":true,"failIfUnavailable":true,"allowUnsandboxedCommands":false}}' | sudo tee "/Library/Application Support/ClaudeCode/managed-settings.json"
          TRIF_TEST_MANAGED=sandbox-on node --test --test-timeout=300000 --test-name-pattern="managed" tests/whole-box.test.js
      # (step 7: so a boxed run gets no Bash and the trif tool, helper/mcp.js; the helper reads the same file)
      - name: The same settings, a side-panel run in TRIF's box with no shell (the trif tool)
        run: TRIF_WHOLE_BOX=1 TRIF_TEST_MANAGED=sandbox-on TRIF_TEST_NO_REAL_CODEX=1 node --test --test-timeout=300000 --test-name-pattern="no shell" tests/run-sandbox.test.js
      - name: Those settings and an MCP denylist naming trif, the run stops and says why
        run: |
          echo '{"sandbox":{"enabled":true,"failIfUnavailable":true,"allowUnsandboxedCommands":false},"deniedMcpServers":[{"serverName":"trif"}]}' | sudo tee "/Library/Application Support/ClaudeCode/managed-settings.json"
          TRIF_WHOLE_BOX=1 TRIF_TEST_MANAGED=sandbox-on-no-mcp TRIF_TEST_NO_REAL_CODEX=1 node --test --test-timeout=300000 --test-name-pattern="no shell" tests/run-sandbox.test.js
      - name: Remove the managed settings
        if: always()
        run: sudo rm -f "/Library/Application Support/ClaudeCode/managed-settings.json"

  # claude.exe in an AppContainer (TRIF's fence launcher), exploration.
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Claude Code in an AppContainer
        run: node tests/whole-box/win-probe.js
      # An organization's managed settings, for real (the runner's own C:\Program Files; never anyone's
      # computer): every tool allowed, no asking, the whole disk. The box must hold under them.
      - name: Managed settings that loosen everything, and the box
        shell: pwsh
        env:
          WBX_SKIP_NO_LOOPBACK: '1'
        run: |
          New-Item -ItemType Directory -Force 'C:\Program Files\ClaudeCode' | Out-Null
          Set-Content -Path 'C:\Program Files\ClaudeCode\managed-settings.json' -Value '{"permissions":{"allow":["Read(//**)","Edit(//**)","Write(//**)","Bash(*)","Glob","Grep"],"defaultMode":"bypassPermissions","additionalDirectories":["C:\\"]}}'
          node tests/whole-box/win-probe.js
