<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRIF probe: an x.com-like timeline</title>
<!-- x.com's mobile layout, roughly: a sticky header (the logo, then the For you / Following tabs) in the document's
     own scrolling, which slides away as you scroll down and comes back as you scroll up; a fixed tab bar at the
     bottom; a long feed. For the app's bars over it (TrifProbeApp.swift BarState). The grey box shows what the page
     is told: window.visualViewport, innerHeight, env(safe-area-inset-top) and where the header is. -->
<style>
  :root { color-scheme: dark; --sat: env(safe-area-inset-top); }
  body { margin: 0; background: #000; color: #e7e9ea; font: 15px/1.4 -apple-system, system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: rgba(0,0,0,.85); transition: transform .2s; border-bottom: 1px solid #2f3336; }
  header.away { transform: translateY(-100%); }
  .logo { height: 53px; display: flex; align-items: center; justify-content: center; font: 800 26px system-ui; border-top: 3px solid #f91880; }
  .tabs { height: 53px; display: flex; } .tabs div { flex: 1; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  article { display: flex; gap: 10px; padding: 12px 16px; border-bottom: 1px solid #2f3336; }
  .av { flex: none; width: 40px; height: 40px; border-radius: 50%; background: #1d9bf0; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; height: 53px; background: #000; border-top: 3px solid #f91880; display: flex; justify-content: space-around; align-items: center; font-weight: 700; }
  #probe { position: fixed; right: 6px; top: 50%; background: #333; color: #fff; font: 11px/1.3 ui-monospace, monospace; padding: 4px 6px; border-radius: 6px; z-index: 3; white-space: pre; }
</style>
</head>
<body>
<header id="head"><div class="logo">𝕏</div><div class="tabs"><div>For you</div><div>Following</div></div></header>
<main id="feed"></main>
<nav><span>Home</span><span>Search</span><span>Bell</span><span>Mail</span></nav>
<div id="probe"></div>
<script nonce="probe">
  const feed = document.getElementById('feed');
  for (let i = 1; i <= 150; i++) { const a = document.createElement('article'); a.innerHTML = `<div class="av"></div><div><b>Person ${i}</b> @p${i}<br>A post long enough to wrap onto a second line on a phone, number ${i}.</div>`; feed.append(a); }
  const head = document.getElementById('head'), probe = document.getElementById('probe');
  let lastY = scrollY;
  addEventListener('scroll', () => { const y = scrollY; if (y > lastY + 4 && y > 106) head.classList.add('away'); else if (y < lastY - 4) head.classList.remove('away'); lastY = y; }, { passive: true });
  const show = () => {
    const vv = visualViewport, r = head.getBoundingClientRect();
    probe.textContent = `vv top ${vv.offsetTop.toFixed(0)} h ${vv.height.toFixed(0)}\ninnerH ${innerHeight}\nsafe top ${getComputedStyle(document.documentElement).getPropertyValue('--sat') || '0'}\nheader ${r.top.toFixed(0)}..${r.bottom.toFixed(0)}`;
    requestAnimationFrame(show);
  };
  show();
</script>
</body>
</html>
