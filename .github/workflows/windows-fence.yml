# A prototype, not part of TRIF yet (docs/WINDOWS.md "The sandbox"): a fence for side-panel agent runs'
# commands on Windows, tried on GitHub's windows-latest runners. Its own workflow, so it never waits for the
# unit tests (.github/workflows/windows.yml). Nothing is published, uploaded or signed; no secrets.
name: windows-fence

on:
  push:
    branches: [windows]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-fence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A prototype, not part of TRIF yet (docs/WINDOWS.md "The sandbox"): a fence for agent runs' commands
  # (an AppContainer, tests/windows-fence), with attempts to get out of each thing TRIF's sandbox
  # guarantees on a Mac.
  fence:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The fence, and attempts to get out of it
        run: node tests/windows-fence/run.js

  # Exploration, never failing: what Claude Code and Codex themselves do on Windows (which shell runs a
  # command, what a CLAUDE_CODE_SHELL_PREFIX program is handed, Codex's own sandboxes with TRIF's profile).
  # Claude Code talks to a stand-in for the API: no account, no paid call.
  agents:
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code and Codex
        run: npm install -g @anthropic-ai/claude-code @openai/codex
      - name: What the agents do here
        run: node tests/windows-fence/agents.js

  # The same fence and attempts, run by an ordinary user (the runner's own account is an administrator):
  # a local account made for this, on a runner that's thrown away afterwards. Never failing: whether a
  # program can be started as another user from here at all is part of what this finds out.
  fence-standard-user:
    runs-on: windows-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The fence, as a user who isn't an administrator
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $name = 'trifstd'
          $plain = 'Tf!' + [guid]::NewGuid().ToString('N') + 'aA1'
          $pw = ConvertTo-SecureString $plain -AsPlainText -Force
          New-LocalUser -Name $name -Password $pw -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group 'Users' -Member $name
          $work = 'C:\trif-std'
          New-Item -ItemType Directory -Force $work | Out-Null
          Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE\helper", "$env:GITHUB_WORKSPACE\tests", "$env:GITHUB_WORKSPACE\extension", "$env:GITHUB_WORKSPACE\examples", "$env:GITHUB_WORKSPACE\package.json" $work
          icacls $work /grant "${name}:(OI)(CI)M" /T /Q | Out-Null
          $node = (Get-Command node).Source
          $cred = New-Object System.Management.Automation.PSCredential($name, $pw)
          Write-Output "node: $node; as: $name (groups below, from inside the run)"
          $p = Start-Process -FilePath $node -ArgumentList "`"$work\tests\windows-fence\run.js`" --yes-this-computer" -Credential $cred -WorkingDirectory $work -RedirectStandardOutput "$work\out.txt" -RedirectStandardError "$work\err.txt" -PassThru -NoNewWindow
          # (not -Wait, which also waits for everything the program started; six minutes, then what it wrote)
          if (-not $p.WaitForExit(360000)) { Write-Output 'still going after six minutes: stopped'; taskkill /PID $p.Id /T /F | Out-Null } else { Write-Output "exit code: $($p.ExitCode)" }
          if (Test-Path "$work\out.txt") { Get-Content "$work\out.txt" }
          if (Test-Path "$work\err.txt") { Write-Output '--- stderr'; Get-Content "$work\err.txt" }
          exit 0
