<!doctype html>
<!-- The Mods tab (branch ios-poc; ModsPanel.swift): the desktop side panel's mods list, with its own styles
     (sidepanel.css, switch.css, from extension/), what the phone changes (mods-page.css), the panel's shared pieces
     (panel-kit.js, made by mobile/prepare.js) and this page's code (mods-page.js). Loads nothing from anywhere else. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
<link rel="stylesheet" href="sidepanel.css">
<link rel="stylesheet" href="switch.css">
<link rel="stylesheet" href="mods-page.css">
</head>
<body>
<main id="panel" class="phone-mods">
  <p id="mods-review-note" class="mods-review-note" hidden></p>
  <p id="mods-empty" class="mods-empty" hidden></p>
  <ul id="mod-list" class="mod-list"></ul>
  <p id="undo-note" class="undo-note" hidden><span id="undo-text"></span> <button id="undo-btn" class="link-btn" type="button">Undo</button></p>
  <section id="hidden-box" class="hidden-box" hidden>
    <h3 class="mod-group-name">Hidden by pointing</h3>
    <ul id="hidden-list" class="hidden-list"></ul>
  </section>
  <p class="mods-tools"><button id="import-mod" class="btn" type="button">Import mod…</button></p>
</main>
<div id="icon-tip" class="icon-tip" role="tooltip" hidden></div>
<script src="panel-kit.js"></script>
<script src="mods-page.js"></script>
</body>
</html>
