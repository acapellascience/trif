# timsrobot.com: the problem report form and the page that receives it (a Cloudflare Worker).
# Deploy from this folder: npx wrangler deploy. See README.md here.
name = "timsrobot-site"
main = "src/index.js"
compatibility_date = "2026-10-01"
# webmods.dev (and www.) is the address from before 0.2.0, when TRIF was called WebMods: the Worker
# redirects it to timsrobot.com (src/index.js redirectFor).
routes = [
  { pattern = "timsrobot.com", custom_domain = true },
  { pattern = "webmods.dev", custom_domain = true },
  { pattern = "www.webmods.dev", custom_domain = true },
]

# Reports are emailed to the address in the REPORT_TO secret (npx wrangler secret put REPORT_TO), which
# must be a verified destination address in Email Routing. It's a secret so it isn't in the public repo.
[[send_email]]
name = "EMAIL"

[vars]
REPORT_FROM = "reports@timsrobot.com"

# At most 5 reports a minute from one address (approximate, per Cloudflare location), and, counted
# separately, 5 Windows waitlist signups.
[[ratelimits]]
name = "REPORT_LIMIT"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 5
  period = 60

# The home page's demo shows the real side panel: the Worker serves the files it needs (src/demo.js
# EXTENSION_FILES, nothing else) from the extension's own folder through this binding. run_worker_first:
# every request goes to the Worker, so no other file there is served; html_handling none: sidepanel.html
# is fetched by that name (no redirect to /sidepanel).
[assets]
directory = "../extension"
binding = "EXTENSION"
run_worker_first = true
html_handling = "none"
