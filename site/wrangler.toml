# timsrobot.com: the problem report form and the page that receives it (a Cloudflare Worker).
# Deploy from this folder: npx wrangler deploy. See README.md here.
name = "timsrobot-site"
main = "src/index.js"
compatibility_date = "2026-10-01"
# webmods.dev (and www.) is the address from before 0.2.0, when TRIF was called WebMods: the Worker
# redirects it to timsrobot.com (src/index.js redirectFor).
routes = [
  { pattern = "timsrobot.com", custom_domain = true },
  { pattern = "www.timsrobot.com", custom_domain = true }, # redirects to timsrobot.com (index.js redirectFor)
  { pattern = "webmods.dev", custom_domain = true },
  { pattern = "www.webmods.dev", custom_domain = true },
]

# Reports are emailed to the address in the REPORT_TO secret (npx wrangler secret put REPORT_TO), which
# must be a verified destination address in Email Routing. It's a secret so it isn't in the public repo.
[[send_email]]
name = "EMAIL"

[vars]
REPORT_FROM = "reports@timsrobot.com"
SYDNEY_DAILY_NEURONS = "100000" # Sydney's daily budget (see [ai] below)

# At most 5 reports a minute from one address (approximate, per Cloudflare location), and, counted
# separately, 5 Windows waitlist signups.
[[ratelimits]]
name = "REPORT_LIMIT"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 5
  period = 60

# Sydney, the demo chat's easter egg (src/sydney.js): a chatbot on Workers AI. Billed in neurons to this
# account (10,000 a day are free); the budget below caps it.
[ai]
binding = "AI"

# At most 6 messages a minute to Sydney from one address (approximate, per Cloudflare location).
[[ratelimits]]
name = "SYDNEY_LIMIT"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 6
  period = 60

# ...and a daily budget for everyone together, in neurons: each reply counts what it could cost at most
# (about 95 to 165 neurons), so 600 to 1,000 replies a day, and at most about $1. Counted by one small Durable Object (SydneyBudget: just today's date and a
# number), created by the first deploy with it (the migration below). The budget is SYDNEY_DAILY_NEURONS in
# [vars] above; "0" puts her to sleep.
[[durable_objects.bindings]]
name = "SYDNEY_BUDGET"
class_name = "SydneyBudget"

[[migrations]]
tag = "v1-sydney-budget"
new_sqlite_classes = ["SydneyBudget"]

# The home page's demo shows the real side panel: the Worker serves the files it needs (src/demo.js
# EXTENSION_FILES, nothing else) from the extension's own folder through this binding. run_worker_first:
# every request goes to the Worker, so no other file there is served; html_handling none: sidepanel.html
# is fetched by that name (no redirect to /sidepanel).
[assets]
directory = "../extension"
binding = "EXTENSION"
run_worker_first = true
html_handling = "none"
