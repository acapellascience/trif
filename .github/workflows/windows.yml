# TRIF on Windows: no side-panel runs yet (docs/WINDOWS.md). Runs on GitHub's windows-latest runners:
#   - the unit tests (tests/windows.test.js runs Windows' own code paths for real there, with real named
#     pipes; tests that need what Windows doesn't have report themselves skipped, with why);
#   - tests/windows-smoke.js, which sets TRIF up the way a user does (registry keys under HKCU, the user's
#     Path, Credential Manager) on the runner, in a profile folder with a space, letters outside ASCII and
#     a % in its name, starts the helper as Chrome does and talks to it over its pipe;
#   - tests/windows-browser.js (Node 22 only): Chrome for Testing, then Microsoft Edge, loads the unpacked
#     extension, and the extension reaches the helper through the registry key and trif-host.bat, as for a
#     user.
# Nothing is published, uploaded or signed, and no secrets are used.
name: windows

on:
  push:
    branches: [windows]
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes the run still going for an older one pointless.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # (shipped-history.json's test reads old versions)
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Line endings are LF (.gitattributes)
        shell: bash
        run: |
          if grep -rlI $'\r' helper extension examples tests --include='*.js' --include='*.json' --include='*.md'; then
            echo "files checked out with CRLF"; exit 1
          fi
      # Node 18's test runner has neither --test-timeout nor --test-concurrency (what `npm test` passes),
      # and Node 18 has no global `crypto` (the extension's code, run by tests/extension.test.js, uses
      # crypto.randomUUID as browsers provide it) without this flag (in NODE_OPTIONS, so each test file's
      # process gets it).
      - name: Unit tests (Node 18)
        if: matrix.node == 18
        env:
          NODE_OPTIONS: --experimental-global-webcrypto
        run: node --test
      - name: Unit tests
        if: matrix.node != 18
        run: npm test
      - name: Smoke test (setup, registry, named pipes, Credential Manager)
        if: always()
        run: node tests/windows-smoke.js
      - name: The phone link's announcer (trif-dnssd.exe built by csc.exe, Windows' DNS-SD API, found by browsing)
        if: always()
        run: node tests/windows-dnssd.js
      - name: Chrome for Testing, for the browser check
        if: always() && matrix.node != 18
        shell: bash
        run: |
          out=$(npx --yes @puppeteer/browsers install chrome@stable --path tests/e2e/.browsers | tail -1)
          echo "$out"
          bin="$(cygpath -w "$PWD")\\${out#* }"
          test -f "$bin" || { echo "Chrome for Testing not found after installing it: $bin"; exit 1; }
          echo "TRIF_E2E_CHROME=$bin" >> "$GITHUB_ENV"
      - name: Browser check (Chrome loads the extension; the extension reaches the helper)
        if: always() && matrix.node != 18
        run: node tests/windows-browser.js
      - name: Browser check, in a profile folder with letters outside ASCII
        if: always() && matrix.node != 18
        run: node tests/windows-browser.js --unicode
      # Microsoft Edge: the browser every Windows has, so the same check must pass in it (stable Edge, as
      # the runner has it, takes --load-extension headless). Setup for Edge alone: Edge's own key
      # (HKCU\Software\Microsoft\Edge\NativeMessagingHosts), doctor's "Microsoft Edge" line, the helper
      # started by Edge, the panel page connected. Its INFO lines say what Edge's extensions page has.
      - name: Browser check in Microsoft Edge, through Edge's own registry key
        if: always() && matrix.node != 18
        shell: pwsh
        run: |
          $edge = @("${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe", "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { Write-Output "no Edge on this runner (windows-latest has had it)"; exit 1 }
          (Get-Item $edge).VersionInfo.ProductVersion
          node tests/windows-browser.js --browser edge --bin "$edge"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: (information) the same with Brave, through Brave's own registry key
        if: always() && matrix.node != 18
        continue-on-error: true
        shell: pwsh
        run: |
          choco install brave -y --no-progress | Select-Object -Last 3
          $brave = @("$env:ProgramFiles\BraveSoftware\Brave-Browser\Application\brave.exe", "${env:ProgramFiles(x86)}\BraveSoftware\Brave-Browser\Application\brave.exe", "$env:LOCALAPPDATA\BraveSoftware\Brave-Browser\Application\brave.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $brave) { Write-Output "no Brave here"; exit 0 }
          Write-Output "=== with Brave's own key alone"
          node tests/windows-browser.js --browser brave --bin "$brave" --drop-key 1
          Write-Output "=== with Chrome's key alone"
          node tests/windows-browser.js --browser brave --bin "$brave" --drop-key 0
          exit 0
      # The unit suite's real-browser tests (the sandbox runtime under real SES, the CSS reader, the
      # clickjacking guard), now that Chrome for Testing is here. Their browser starts on Windows; their
      # pages don't all load yet, so for now this informs and never fails the job.
      - name: (information) the real-browser unit tests
        if: always() && matrix.node != 18
        continue-on-error: true
        run: node --test --test-timeout=180000 tests/cdp-page.test.js tests/sandbox-browser.test.js tests/css-browser.test.js tests/clickjack-browser.test.js

  # For information, never failing: every test the list in tests/windows-skips.json skips on Windows, run
  # anyway, to see which pass by now (a test that does comes off the list).
  still-skipped:
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The skipped tests, run anyway
        shell: bash
        env:
          TRIF_TEST_POSIX_ON_WINDOWS: 1
        run: |
          # (bash here stops at the first command that fails: each one is let fail)
          node --test --test-timeout=120000 --test-reporter=tap > all-on-windows.tap 2>&1 || true
          grep -cE "^ok " all-on-windows.tap || true
          grep -E "^not ok " all-on-windows.tap | head -150 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-on-windows
          path: all-on-windows.tap
          if-no-files-found: ignore
