<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebMods</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f5; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --line: #e3e3e0;
    --ok: #1f8a4c; --bad: #c4372d; --accent: #2f5bd3; --code: #f0f0ed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161617; --card: #1f1f21; --text: #ececee; --muted: #9a9aa0; --line: #333336;
      --ok: #4cc27f; --bad: #ff6b5e; --accent: #7d9cff; --code: #2a2a2d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  main { max-width: 640px; margin: 48px auto; padding: 0 16px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; }
  h2 { font-size: 16px; margin: 0; display: flex; align-items: center; gap: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  .ok .dot { background: var(--ok); }
  .bad .dot { background: var(--bad); }
  .detail { margin: 8px 0 0 20px; color: var(--muted); }
  .detail:empty { display: none; }
  code { background: var(--code); padding: 1px 6px; border-radius: 5px; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  button {
    margin: 12px 0 0 20px; font: inherit; font-size: 14px; color: #fff; background: var(--accent);
    border: 0; border-radius: 8px; padding: 7px 14px; cursor: pointer;
  }
  button[hidden] { display: none; }
  ul { list-style: none; margin: 10px 0 0; padding: 0; }
  li { padding: 10px 0; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  .mod-name { font-weight: 600; }
  .mod-id, .mod-desc { color: var(--muted); font-size: 13px; }
  .mod-err { color: var(--bad); font-size: 13px; }
  .tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; margin-left: 6px; }
  footer { color: var(--muted); font-size: 12px; margin-top: 20px; }
</style>
</head>
<body>
<main>
  <h1>WebMods</h1>
  <p class="sub">Customize websites with mods written by your coding agent.</p>

  <section id="helper">
    <h2><span class="dot"></span><span class="title">Helper</span></h2>
    <p class="detail"></p>
    <button id="reconnect" hidden>Try again</button>
  </section>

  <section id="userscripts">
    <h2><span class="dot"></span><span class="title">Allow User Scripts</span></h2>
    <p class="detail"></p>
    <button id="settings" hidden>Open extension settings</button>
  </section>

  <section id="mods">
    <h2><span class="title">Mods</span></h2>
    <p class="detail"></p>
    <ul id="mod-list"></ul>
  </section>

  <footer id="footer"></footer>
</main>
<script src="onboarding.js"></script>
</body>
</html>
