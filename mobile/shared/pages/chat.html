<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stand-in chat</title>
<!--
  A stand-in for claude.ai, for the iPhone app's chat in the Simulator (where neither chat can be signed in to):
  the app with `-chathome http://localhost:8377/chat.html` (node mobile/serve.js) uses it for Claude and ChatGPT.
  It has what TRIF's Web/chat.js looks for on claude.ai: a ProseMirror message box that takes pasted files as
  tiles ([data-testid=file-thumbnail]), a "Send message" button, the person's messages ([data-testid=user-message]),
  a reply ([data-is-streaming], .font-claude-response) written a few words at a time with a "Stop response"
  button meanwhile, and the address changing to /chat/<id> after the first send, as Claude's does.
  The reply: a style mod for the page named in what was attached or said (its first address), in a code block; two mods
  if the message says "two"; no mod at all if it says "no mod"; the mod as an attached file if it says "file" (and in a code block too: "file and block"),
  ?gpt gives ChatGPT's /c/<id> addresses; "wait 90" makes it take about 90 seconds. `?slow` writes it more slowly; `?nostop` has no stop button or streaming mark (a chat
  that changed its page: TRIF's fallback, the reply unchanged for a few seconds). `?draft` keeps the box's
  attachments and text across a reload and puts them back 0.8 s after the page loads, as claude.ai keeps a draft;
  `?gptpaste` takes a pasted text file as its text, as chatgpt.com did on Tim's iPhone (11-16), while its hidden file
  input (the paper clip's) still makes tiles.
  `?octane`: as chatgpt.com's mobile page (logged out, 11-16): messages are li[data-message-role], the reply's li gets
  data-message-complete when it's done, and in the middle of writing it pauses 3 s with no stop button (as it does
  while it searches); its file inputs take pictures only (a text file given to one: "The selected file is not a supported
  image."); `?cm` writes code blocks as a code editor's lines (div.cm-editor > div.cm-line), not a pre.
  "viewer" in the message: the mod as a file card that isn't a link (Claude's, 11-16): a tap opens a viewer over the
  whole chat (a dialog with the file's name, Download and Close, its code with line numbers a person can't select),
  the message box still there underneath; `?viewerroute` gives the viewer an address of its own (/chat/<id>/files/<name>)
  that Back or Close leaves.
  `?pasted` (Tim, 11-18: "When I paste code into Claude in the app, the app reads it as a mod"): a paste of several lines
  goes into the message box as a code block (a pre inside the ProseMirror, as claude.ai renders pasted code), and one
  of 20 lines or more as a pasted-text tile (PASTED, a preview of the text in a pre); the sent message keeps both (the
  code block, and the pasted card, which a tap opens in the viewer, as Claude opens pasted text). None of it is ever
  the assistant's.
  `?oldchat` (Tim, 11-18: "opening an old chat gets spurious pickups of old code"): the page is an old conversation that
  loads in pieces, as a long claude.ai one does: the last reply first (an empty box filled in twice, no streaming
  mark), then the reply before it, then the person's messages late, all in a history box above anything sent here; a
  scroll to the top of the conversation (or window.__standinScrollUp()) renders an older exchange above and draws the
  others again (new elements, the same text). Every one of its mods is old. The header's "Older chat" button goes to
  such a conversation in the page (its address /chat/old-…, no load, as claude.ai's Recents), whatever is going on.
  /new serves this page too (a new chat there gets /chat/<id> at its first send).
  `?greet`: an empty conversation's greeting heading ("How can I help you today?", as both chats have one) and an
  Upgrade plan button in the header, for TRIF's greeting and upsell hiding (chat.js look).
-->
<style>
  :root { color-scheme: light dark; --bg: #faf9f5; --fg: #1f1e1d; --line: #d8d5cc; --tile: #ece9e0; --you: #efece4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #262624; --fg: #f0eee6; --line: #45433f; --tile: #383733; --you: #30302d; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 16px/1.45 -apple-system, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { padding: 10px 14px; font-weight: 600; border-bottom: 1px solid var(--line); }
  #log { flex: 1; overflow-y: auto; padding: 12px 14px; }
  #log > li { list-style: none; }
  [data-testid="user-message"] { background: var(--you); border-radius: 14px; padding: 10px 12px; margin: 10px 0 10px 40px; white-space: pre-wrap; }
  .font-claude-response { margin: 10px 0; }
  pre { background: #1e1e1e; color: #e6e6e6; padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 12px; }
  .sent-file { display: inline-block; font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--tile); margin: 0 6px 6px 0; }
  .composer { border-top: 1px solid var(--line); padding: 8px 10px 12px; }
  .tiles:empty { display: none; }
  .tiles { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  [data-testid="file-thumbnail"] { display: inline-flex; align-items: center; gap: 6px; background: var(--tile); border-radius: 8px; padding: 6px 8px; font-size: 13px; }
  [data-testid="file-thumbnail"] button { border: 0; background: none; color: inherit; font-size: 15px; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .ProseMirror { flex: 1; min-height: 24px; max-height: 140px; overflow-y: auto; border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; outline: none; white-space: pre-wrap; }
  .ProseMirror:empty::before { content: "Reply to the stand-in…"; opacity: 0.5; }
  .row button { width: 40px; height: 40px; border-radius: 10px; border: 0; background: #c96442; color: white; font-size: 18px; }
  .row button:disabled { opacity: 0.4; }
  .toast { position: fixed; top: 10px; left: 10px; right: 10px; background: #fff; color: #111; border-radius: 12px; padding: 10px; box-shadow: 0 2px 10px #0003; }
  .file-card { display: inline-flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin: 6px 0; cursor: pointer; }
  .file-card small { opacity: 0.6; }
  .viewer { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 10; }
  .viewer header { display: flex; gap: 8px; align-items: center; }
  .viewer header span { flex: 1; }
  .viewer pre { flex: 1; margin: 0; border-radius: 0; overflow: auto; }
  .pasted { flex-direction: column; align-items: flex-start !important; max-width: 220px; }
  .pasted small, .pasted-card small { font-size: 10px; letter-spacing: 0.06em; opacity: 0.7; }
  .pasted pre, .pasted-card pre { max-height: 3.6em; overflow: hidden; margin: 2px 0 0; padding: 4px 6px; font-size: 9px; }
  .pasted-card { display: inline-flex; flex-direction: column; max-width: 220px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; margin: 0 0 6px; cursor: pointer; white-space: normal; }
  .ProseMirror pre { white-space: pre; margin: 4px 0; }
  .viewer .linenumber { display: inline-block; width: 2.2em; opacity: 0.45; user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>
<header>Stand-in chat <button type="button" id="old-chat" style="float: right; font: 13px system-ui; border: 1px solid var(--line); border-radius: 8px; background: none; color: inherit;">Older chat</button></header>
<div id="log"></div>
<div class="composer">
  <div class="tiles"></div>
  <div class="row">
    <div class="ProseMirror" contenteditable="true"></div>
    <button type="button" aria-label="Send message" disabled>↑</button>
  </div>
</div>
<script>
(() => {
  const log = document.getElementById('log');
  const tiles = document.querySelector('.tiles');
  const ed = document.querySelector('.ProseMirror');
  const row = document.querySelector('.row');
  let send = row.querySelector('button');
  const files = [];
  const slow = location.search.includes('slow');
  // (?slowload: a picture that takes five seconds (node's slow server on 8378), so the page keeps loading long after
  // its message box is there, as claude.ai's does)
  if (location.search.includes('slowload')) { const i = new Image(); i.src = `http://localhost:8378/slow?${Date.now()}`; document.body.append(i); }
  const nostop = location.search.includes('nostop');
  if (location.search.includes('greet')) {
    const h = document.createElement('h1');
    h.className = 'greet';
    h.textContent = 'How can I help you today?';
    h.style.cssText = 'font: 600 26px/1.3 Georgia, serif; text-align: center; margin: 22vh 0 0;';
    log.append(h);
    const up = document.createElement('button');
    up.type = 'button';
    up.textContent = 'Upgrade plan';
    up.style.cssText = 'float: right; font: 13px system-ui; border: 1px solid var(--line); border-radius: 8px; background: none; color: inherit;';
    document.querySelector('header').append(up);
    new MutationObserver(() => { if (log.querySelector('[data-testid="user-message"]')) h.remove(); }).observe(log, { childList: true });
  }

  const refresh = () => { send.disabled = !(ed.textContent.trim() || files.length || pastes.length); };
  ed.addEventListener('input', refresh);
  // (?draft: the box's attachments and text kept across a reload and put back a moment after the page loads, as
  // claude.ai keeps a draft)
  const draft = location.search.includes('draft');
  const saveDraft = () => { if (draft) sessionStorage.setItem('draft', JSON.stringify({ text: ed.textContent, files })); };
  function addFile(name, text, type) {
    const entry = { name, text: text || '' };
    files.push(entry);
    const tile = document.createElement('div');
    tile.setAttribute('data-testid', 'file-thumbnail');
    const label = document.createElement('span');
    label.textContent = name;
    const x = document.createElement('button');
    x.type = 'button';
    x.setAttribute('aria-label', `Remove ${name}`);
    x.textContent = '×';
    x.addEventListener('click', () => { files.splice(files.indexOf(entry), 1); tile.remove(); refresh(); saveDraft(); });
    tile.append(label, x);
    tiles.append(tile);
    return entry;
  }
  const takeFile = (f) => { const entry = addFile(f.name, '', f.type); if (f.type.startsWith('text/')) f.text().then((t) => { entry.text = t; saveDraft(); }); };
  // (?gptpaste: as chatgpt.com on Tim's iPhone, 11-16: a pasted text file goes into the box as its text; pictures
  // and files picked with the file input (the paper clip) become tiles)
  const gptpaste = location.search.includes('gptpaste');
  const octane = location.search.includes('octane');
  const cm = location.search.includes('cm');
  const picker = document.createElement('input');
  picker.type = 'file';
  picker.multiple = true;
  picker.hidden = true;
  if (octane) { picker.id = 'octane-mobile-composer-files-input'; picker.accept = 'image/avif,image/bmp,image/gif,image/heic,image/heif,image/jpeg,image/png,image/webp'; }
  const toast = (t) => { const n = document.createElement('div'); n.className = 'toast'; n.textContent = t; document.body.append(n); setTimeout(() => n.remove(), 3000); };
  picker.addEventListener('change', () => {
    for (const f of picker.files) {
      if (octane && !f.type.startsWith('image/')) { toast('The selected file is not a supported image.'); continue; }
      takeFile(f);
    }
    refresh(); saveDraft();
  });
  document.querySelector('.composer').append(picker);
  ed.addEventListener('paste', (e) => {
    const dt = e.clipboardData;
    if (!dt) return;
    e.preventDefault();
    const list = [...dt.files];
    if (list.length) {
      for (const f of list) {
        if (octane && !f.type.startsWith('image/')) { toast('The selected file is not a supported image.'); continue; }
        if (gptpaste && !f.type.startsWith('image/')) f.text().then((t) => { document.execCommand('insertText', false, t); refresh(); saveDraft(); });
        else takeFile(f);
      }
    } else if (pastedMode && /\n/.test(dt.getData('text/plain').trim())) {
      // (?pasted: several lines as a code block in the box, 20 or more as a pasted-text tile)
      const t = dt.getData('text/plain');
      if (t.trim().split('\n').length >= 20) addPasted(t);
      else {
        const pre = document.createElement('pre');
        const code = document.createElement('code');
        code.textContent = t;
        pre.append(code);
        const after = document.createTextNode('');
        ed.append(pre, after);
        getSelection().collapse(after, 0); // (the caret after the block, as an editor leaves it)
      }
    } else {
      document.execCommand('insertText', false, dt.getData('text/plain'));
    }
    refresh();
    saveDraft();
  });
  // (?pasted: a pasted-text tile in the box (Claude's PASTED card), its text in a preview; sent, a card in the message)
  const pastedMode = location.search.includes('pasted');
  const pastes = [];
  const pastedPreview = (t, cls) => {
    const el = document.createElement('div');
    el.className = cls;
    const small = document.createElement('small');
    small.textContent = 'PASTED';
    const pre = document.createElement('pre');
    pre.textContent = t;
    el.append(small, pre);
    return el;
  };
  function addPasted(t) {
    const entry = { text: t };
    pastes.push(entry);
    const tile = pastedPreview(t, 'pasted');
    tile.setAttribute('data-testid', 'file-thumbnail');
    const x = document.createElement('button');
    x.type = 'button';
    x.setAttribute('aria-label', 'Remove pasted text');
    x.textContent = '×';
    x.addEventListener('click', () => { pastes.splice(pastes.indexOf(entry), 1); tile.remove(); refresh(); });
    tile.append(x);
    tiles.append(tile);
  }
  ed.addEventListener('input', saveDraft);
  const kept = draft ? JSON.parse(sessionStorage.getItem('draft') || 'null') : null; // (the draft from before the load)
  if (draft) setTimeout(() => {
    const d = kept;
    if (!d) return;
    for (const f of d.files) addFile(f.name, f.text);
    if (d.text) ed.textContent = d.text;
    refresh();
  }, 800);
  // (every send, and whether a person did it: TRIF must never send here (the quick ask's hard rule). A click or an
  // Enter a script made (isTrusted false), a submit, or form.submit/requestSubmit called: counted as `untrusted`)
  const sends = window.__standinSends = [];
  const noteSend = (how, e) => sends.push({ how, trusted: !!(e && e.isTrusted), at: Date.now() });
  window.__standinUntrusted = () => sends.filter((x) => !x.trusted).length;
  document.addEventListener('click', (e) => { if (e.target.closest && e.target.closest('button[aria-label="Send message"]') && !e.isTrusted) noteSend('scripted click', e); }, true);
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isTrusted) noteSend('scripted Enter', e); }, true);
  document.addEventListener('submit', (e) => noteSend('submit', e), true);
  for (const name of ['submit', 'requestSubmit']) { const was = HTMLFormElement.prototype[name]; HTMLFormElement.prototype[name] = function (...a) { noteSend(`form.${name}()`, null); return was.apply(this, a); }; }
  ed.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (e.isTrusted) noteSend('Enter', e); go(); } });
  row.addEventListener('click', (e) => { if (e.target.closest('button[aria-label="Send message"]')) { if (e.isTrusted) noteSend('button', e); go(); } });

  // (origin null: no @match line, as desktop's mods in a site's folder (FeedBook): the site comes from the chat's)
  const modFor = (origin, name, body) => `// ==WebMod==
// @name        ${name}
// @description Made by the stand-in chat${origin ? `\n// @match       ${origin}/*` : ''}
// @style
// ==/WebMod==
${JSON.stringify(body, null, 2)}`;

  function go() {
    const text = ed.textContent.trim();
    if (!text && !files.length && !pastes.length) return;
    const attached = files.map((f) => f.text).join('\n');
    const msg = document.createElement(octane ? 'li' : 'div');
    if (octane) msg.setAttribute('data-message-role', 'user'); else msg.setAttribute('data-testid', 'user-message');
    for (const f of files) { const s = document.createElement('span'); s.className = 'sent-file'; s.textContent = f.name; msg.append(s, document.createElement('br')); }
    // (?pasted: the person's pasted cards, a tap opening the text in the viewer, and the box's code blocks as they were)
    for (const p of pastes) { const card = pastedPreview(p.text, 'pasted-card'); card.setAttribute('role', 'button'); card.addEventListener('click', () => openViewer('Pasted text', p.text)); msg.append(card, document.createElement('br')); }
    if (pastedMode && ed.querySelector('pre')) msg.append(...[...ed.childNodes].map((n) => n.cloneNode(true)));
    else msg.append(text);
    log.append(msg);
    ed.textContent = '';
    files.length = 0;
    pastes.length = 0;
    tiles.textContent = '';
    if (draft) sessionStorage.removeItem('draft');
    if (!/^\/(chat|c)\//.test(location.pathname)) history.pushState({}, '', `/${location.search.includes('gpt') ? 'c' : 'chat'}/${Math.random().toString(36).slice(2, 10)}${location.search}`);
    // ("no match": the mod has no @match line)
    const origin = /no match/i.test(text) ? null : (((`${attached} ${text}`.match(/https?:\/\/[^\s/]+/) || [])[0]) || 'http://localhost:8377').replace(/:\d+$/, ''); // (a match pattern has no port)
    let parts;
    if (/no mod/i.test(text)) parts = [['p', 'Which part of the page do you mean? Point TRIF at it and send me that.']];
    // ("file": the mod as an attached file, a card with a download link, as Claude's file cards, for a tap; "file
    // and block": the same mod in a code block too)
    // ("powers": a boxed mod asking for a power, so Add this mod? and its OK come up, never added by itself)
    else if (/powers/i.test(text)) parts = [['p', 'This one needs to click for you, so TRIF will ask first.'], ['pre', `// ==WebMod==
// @name        Auto expand
// @description Opens collapsed posts (from the stand-in chat)${origin ? `\n// @match       ${origin}/*` : ''}
// @boxed
// @powers      click
// @click       the show more buttons: button.show-more
// ==/WebMod==
trif.css('.feed-item { outline: 1px dashed #c96442 }'); // ${text.slice(0, 40).replace(/[^\w ]/g, '')}`]];
    else if (/viewer/i.test(text)) parts = [['p', 'Here it is as a file:'], ['card', modFor(origin, 'Calmer feed', { css: '.feed-item h2 { color: #1f8a5b }', hide: ['#promo-banner'] }), 'calmer-feed.js']];
    else if (/file/i.test(text)) {
      parts = [['p', 'The mod is big, so here it is as a file:'], ['a', '/stand-in-file/calmer-feed.js', 'calmer-feed.js']];
      if (/block/i.test(text)) parts.push(['pre', modFor('http://localhost', 'Calmer feed', { css: '.feed-item h2 { color: #1f8a5b }' })]);
    }
    else {
      // ("called <Name>": the mod's name (a new mod, not an update of Calmer feed); "ask <words>": those words in its
      // CSS, so each quick ask's mod is code of its own)
      const called = (text.match(/called (\w+)/i) || [])[1];
      const asked = (text.match(/ask ([\w ]{1,40})/i) || [])[1];
      parts = [['p', 'Here is a style mod that does that. It only changes how the page looks.'],
        ['pre', modFor(origin, called || 'Calmer feed', { css: `.feed-item h2 { color: #1f8a5b }${asked ? ` /* ${asked.trim()} */` : ''}`, hide: ['#promo-banner', '.feed-item.promoted'] })]];
      if (/two/i.test(text)) parts.push(['p', 'And a second one for the cookie box:'], ['pre', modFor(origin, 'No cookie box', { hide: ['.cookie-consent'] })]);
      parts.push(['p', 'Add it, and tell me if anything looks wrong.']);
    }
    reply(parts, Number((text.match(/wait (\d+)/i) || [])[1] || 0));
  }

  // (?history: a long conversation whose older messages render late, as claude.ai draws them a little at a time: an
  // older exchange with an earlier version of the mod put at the top 1.5 s after the load, and another 2 s after
  // each reply ends. Their code is old: never offered (Tim, 11-17). ?reopen: the chat reopens a viewer by itself on
  // an old file 1 s after the load, with no tap)
  const older = location.search.includes('history');
  let olderN = 0;
  function addOlder() {
    olderN++;
    const u = document.createElement(octane ? 'li' : 'div');
    if (octane) u.setAttribute('data-message-role', 'user'); else u.setAttribute('data-testid', 'user-message');
    u.textContent = `an older ask (${olderN})`;
    const r = document.createElement(octane ? 'li' : 'div');
    if (octane) r.setAttribute('data-message-role', 'assistant'); else r.className = 'font-claude-response';
    const pre = document.createElement('pre');
    const code = document.createElement('code');
    code.textContent = modFor('http://localhost', 'Calmer feed', { css: `.feed-item h2 { color: #b2${olderN}2${olderN}2 }` });
    pre.append(code);
    r.append(Object.assign(document.createElement('p'), { textContent: 'An older version:' }), pre);
    log.prepend(u, r);
  }
  if (older) setTimeout(addOlder, 1500);
  if (location.search.includes('reopen')) setTimeout(() => openViewer('old-feed.js', modFor('http://localhost', 'Calmer feed', { css: '.feed-item h2 { color: #b22222 }' })), 1000);

  // (?oldchat, and the header's Older chat: an old conversation that loads in pieces, all into a history box above
  // anything sent here; scrolled to the top, an older exchange renders and the rest is drawn again)
  const oldMod = (n) => modFor('http://localhost', `Old feed ${n}`, { css: `.feed-item h2 { color: #3${n}3${n}a${n} }` });
  function oldExchange(n) {
    const u = document.createElement(octane ? 'li' : 'div');
    if (octane) u.setAttribute('data-message-role', 'user'); else u.setAttribute('data-testid', 'user-message');
    u.textContent = `an old ask (${n})`;
    const r = document.createElement(octane ? 'li' : 'div');
    if (octane) r.setAttribute('data-message-role', 'assistant'); else { r.className = 'font-claude-response'; r.setAttribute('data-is-streaming', 'false'); }
    return { u, r, fill: () => { const pre = document.createElement('pre'); const code = document.createElement('code'); code.textContent = oldMod(n); pre.append(code); r.append(Object.assign(document.createElement('p'), { textContent: `Old reply ${n}:` }), pre); } };
  }
  let oldGen = 0;
  function loadOld() {
    const gen = ++oldGen;
    let hist = log.querySelector('.history');
    if (!hist) { hist = document.createElement('div'); hist.className = 'history'; log.prepend(hist); }
    const later = (ms, f) => setTimeout(() => { if (gen === oldGen && hist.isConnected) f(); }, ms);
    const e2 = oldExchange(2), e1 = oldExchange(1);
    // (bottom first: the last reply's box, then its text in two goes, no streaming mark)
    later(300, () => { hist.append(e2.r); });
    later(450, () => { const pre = document.createElement('pre'); const code = document.createElement('code'); code.textContent = oldMod(2).slice(0, 60); pre.append(code); e2.r.append(Object.assign(document.createElement('p'), { textContent: 'Old reply 2:' }), pre); });
    later(900, () => { e2.r.querySelector('pre code').textContent = oldMod(2); });
    later(1300, () => { e1.fill(); hist.prepend(e1.r); });
    // (the person's messages late, each before its reply)
    later(2000, () => { e1.r.before(e1.u); e2.r.before(e2.u); });
    let rerendered = false;
    const up = () => {
      if (rerendered || gen !== oldGen) return;
      rerendered = true;
      const e0 = oldExchange(0);
      e0.fill();
      for (const n of [...hist.children]) n.replaceWith(n.cloneNode(true));
      hist.prepend(e0.u, e0.r);
    };
    window.__standinScrollUp = up;
    log.addEventListener('scroll', () => { if (log.scrollTop < 10 && hist.childElementCount >= 4) up(); });
  }
  document.getElementById('old-chat').addEventListener('click', () => {
    history.pushState({}, '', `/chat/old-${Math.random().toString(36).slice(2, 8)}${location.search}`);
    log.textContent = '';
    loadOld();
  });
  if (location.search.includes('oldchat')) loadOld();

  // (Claude's file viewer, as far as it matters here: over the whole chat, the message box left underneath)
  function openViewer(name, code) {
    const v = document.createElement('div');
    v.className = 'viewer';
    v.setAttribute('role', 'dialog');
    v.setAttribute('aria-modal', 'true');
    v.innerHTML = '<header><span></span><button type="button" aria-label="Download">Download</button><button type="button" aria-label="Close">✕</button></header><pre><code></code></pre>';
    v.querySelector('header span').textContent = name;
    const c = v.querySelector('code');
    code.split('\n').forEach((line, i) => { const n = document.createElement('span'); n.className = 'linenumber'; n.textContent = String(i + 1); c.append(n, `${line}\n`); });
    const routed = location.search.includes('viewerroute');
    const close = () => { v.remove(); if (routed && /\/files\//.test(location.pathname)) history.back(); };
    v.querySelector('[aria-label="Close"]').addEventListener('click', close);
    v.querySelector('[aria-label="Download"]').addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
      a.download = name;
      document.body.append(a);
      a.click();
      a.remove();
    });
    if (routed) {
      history.pushState({ viewer: name }, '', `${location.pathname.replace(/\/files\/.*$/, '')}/files/${name}${location.search}`);
      addEventListener('popstate', () => v.remove(), { once: true });
    }
    document.body.append(v);
  }

  function reply(parts, seconds) {
    const stop = document.createElement('button');
    stop.type = 'button';
    stop.setAttribute('aria-label', 'Stop response');
    stop.textContent = '■';
    if (!nostop) send.replaceWith(stop);
    else send.disabled = true;
    const box = document.createElement(octane ? 'li' : 'div');
    if (octane) box.setAttribute('data-message-role', 'assistant');
    else box.className = 'font-claude-response';
    if (!octane && location.pathname.startsWith('/c/')) { box.setAttribute('data-message-author-role', 'assistant'); box.setAttribute('data-message-id', `msg-${Date.now()}`); }
    if (!nostop && !octane) box.setAttribute('data-is-streaming', 'true');
    log.append(box);
    const steps = [];
    for (const [tag, t, label] of parts) {
      if (tag === 'card') {
        steps.push(() => {
          const card = document.createElement('div');
          card.className = 'file-card';
          card.setAttribute('role', 'button');
          card.tabIndex = 0;
          card.innerHTML = `<b></b><small>JS</small>`;
          card.querySelector('b').textContent = label;
          card.addEventListener('click', () => openViewer(label, t));
          box.append(card);
        });
        continue;
      }
      if (tag === 'a') {
        steps.push(() => { const card = document.createElement('div'); card.setAttribute('data-testid', 'file-card'); const a = document.createElement('a'); a.href = t; a.textContent = label; a.setAttribute('download', label); card.append('📄 ', a); box.append(card); });
        continue;
      }
      if (tag === 'pre' && cm) {
        // (a code editor's lines, as some chats show code: each line an element of its own)
        steps.push(() => { const e = document.createElement('div'); e.className = 'cm-editor'; const c = document.createElement('div'); c.className = 'cm-content'; for (const line of t.split('\n')) { const l = document.createElement('div'); l.className = 'cm-line'; l.textContent = line; c.append(l); } e.append(c); box.append(e); });
        continue;
      }
      const words = t.split(/(?<=\s)/);
      let into = null; // (not box.lastElementChild: TRIF puts its Add to TRIF button after a code block)
      steps.push(() => { const n = document.createElement(tag); into = n; if (tag === 'pre') { into = document.createElement('code'); n.append(into); } box.append(n); });
      for (let i = 0; i < words.length; i += tag === 'pre' ? 6 : 2) {
        const chunk = words.slice(i, i + (tag === 'pre' ? 6 : 2)).join('');
        steps.push(() => { into.append(chunk); });
      }
    }
    // ("wait N" in the message: the reply takes about N seconds, written a little at a time)
    const each = seconds ? Math.max(90, (seconds * 1000) / steps.length) : slow ? 220 : 90;
    let i = 0;
    let pauseAt = octane ? Math.floor(steps.length / 3) : -1;
    const tick = () => {
      // (?octane: a 3 s pause partway, with no stop button, as chatgpt.com's while it searches)
      if (i === pauseAt) { pauseAt = -1; const s2 = stop; s2.replaceWith(send); setTimeout(() => { send.replaceWith(s2); tick(); }, 3000); return; }
      if (i < steps.length) { steps[i++](); log.scrollTop = log.scrollHeight; setTimeout(tick, each); return; }
      if (octane) box.setAttribute('data-message-complete', '');
      if (nostop) { refresh(); return; }
      box.setAttribute('data-is-streaming', 'false');
      send = document.createElement('button');
      send.type = 'button';
      send.setAttribute('aria-label', 'Send message');
      send.textContent = '↑';
      stop.replaceWith(send);
      refresh();
      if (older) setTimeout(addOlder, 2000);
    };
    setTimeout(tick, 600);
  }
})();
</script>
