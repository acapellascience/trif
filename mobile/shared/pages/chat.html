<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stand-in chat</title>
<!--
  A stand-in for claude.ai, for the iPhone app's chat in the Simulator (where neither chat can be signed in to):
  the app with `-chathome http://localhost:8377/chat.html` (node mobile/serve.js) uses it for Claude and ChatGPT.
  It has what TRIF's Web/chat.js looks for on claude.ai: a ProseMirror message box that takes pasted files as
  tiles ([data-testid=file-thumbnail]), a "Send message" button, the person's messages ([data-testid=user-message]),
  a reply ([data-is-streaming], .font-claude-response) written a few words at a time with a "Stop response"
  button meanwhile, and the address changing to /chat/<id> after the first send, as Claude's does.
  The reply: a style mod for the page named in what was attached or said (its first address), in a code block; two mods
  if the message says "two"; no mod at all if it says "no mod"; the mod as an attached file if it says "file" (and in a code block too: "file and block"),
  ?gpt gives ChatGPT's /c/<id> addresses; "wait 90" makes it take about 90 seconds. `?slow` writes it more slowly; `?nostop` has no stop button or streaming mark (a chat
  that changed its page: TRIF's fallback, the reply unchanged for a few seconds). `?draft` keeps the box's
  attachments and text across a reload and puts them back 0.8 s after the page loads, as claude.ai keeps a draft;
  `?gptpaste` takes a pasted text file as its text, as chatgpt.com did on Tim's iPhone (11-16), while its hidden file
  input (the paper clip's) still makes tiles.
  `?octane`: as chatgpt.com's mobile page (logged out, 11-16; signed in, 11-19: a picture's tile is a
  div[role=button].composer-attachment-surface named by its aria-label and img alt, and a name used before gets "(n)"
  before its extension): messages are li[data-message-role], the reply's li gets
  data-message-complete when it's done, and in the middle of writing it pauses 3 s with no stop button (as it does
  while it searches); its file inputs take pictures only (a text file given to one: "The selected file is not a supported
  image."); `?cm` writes code blocks as a code editor's lines (div.cm-editor > div.cm-line), not a pre.
  "viewer" in the message: the mod as a file card that isn't a link (Claude's, 11-16): a tap opens a viewer over the
  whole chat (a dialog with the file's name, Download and Close, its code with line numbers a person can't select),
  the message box still there underneath; `?viewerroute` gives the viewer an address of its own (/chat/<id>/files/<name>)
  that Back or Close leaves.
  `?pasted` (Tim, 11-18: "When I paste code into Claude in the app, the app reads it as a mod"): a paste of several lines
  goes into the message box as a code block (a pre inside the ProseMirror, as claude.ai renders pasted code), and one
  of 20 lines or more as a pasted-text tile (PASTED, a preview of the text in a pre); the sent message keeps both (the
  code block, and the pasted card, which a tap opens in the viewer, as Claude opens pasted text). None of it is ever
  the assistant's.
  `?oldchat` (Tim, 11-18: "opening an old chat gets spurious pickups of old code"): the page is an old conversation that
  loads in pieces, as a long claude.ai one does: the last reply first (an empty box filled in twice, no streaming
  mark), then the reply before it, then the person's messages late, all in a history box above anything sent here; a
  scroll to the top of the conversation (or window.__standinScrollUp()) renders an older exchange above and draws the
  others again (new elements, the same text). Every one of its mods is old. The header's "Older chat" button goes to
  such a conversation in the page (its address /chat/old-…, no load, as claude.ai's Recents), whatever is going on.
  /new serves this page too (a new chat there gets /chat/<id> at its first send).
  `?greet`: an empty conversation's greeting heading ("How can I help you today?", as both chats have one) and an
  Upgrade plan button in the header, for TRIF's greeting and upsell hiding (chat.js look).
  `?suggest` (Tim, 11-19, chatgpt.com signed in): ChatGPT's own suggestions, a list of buttons just above the box
  (two; four once something is attached: "Extract the text", "Describe the image"…), so a taller box pushes them up
  into the empty conversation's middle, where TRIF's greeting goes.
  `?late` (Tim, 11-18: the quick ask's strip bounced while claude.ai loaded): the page settles in pieces, as claude.ai's
  does on a phone: the box's tool row (+, the model, Manual) comes 1 s after load, the "… can make mistakes." line above
  the box 1.6 s after, the page's own box grows a little at 2.2 s, and each attachment's tile shows 0.5 s after it's
  taken (a tile placeholder first).
  `?gptdraft` (Tim, 11-18: chatgpt.com put an old TRIF fill for a YouTube page back into a chat opened on x.com): as
  chatgpt.com keeps an unsent message, ONE draft for the whole site (localStorage `standin-draft`, the box's text only,
  saved at each change, gone at a send), put back into the box of any chat page 0.8 s after it loads (`?gptdraft=2500`:
  that many ms), replacing what's there as its editor does.
  `?gptin` (11-19, chatgpt.com signed in, checked in the Simulator with Tim's account, nothing sent): `?octane`'s messages
  and picture tiles, and its composer as signed in: the box a ProseMirror named "Ask ChatGPT" in a form, its Send a
  type=submit button named "Send" (a submit is the send), "Select ChatGPT model", an "Attach files" input that takes any
  file, a file's tile a span.group/composer-attachment (name in a span.truncate, a button named by it, "Remove …").
  `?nested` (11-18, claude.ai's code blocks: "pre.code-block__code code.language-js code"): each code block, once
  written, drawn as claude.ai's: pre.code-block__code > code.language-js holding a code of line numbers (a column a
  person can't select) and the code in spans; `?nested=inline`: each line's number at its start instead.
  "whole" in the message: the reply drawn all at once, finished, with no stop button or streaming mark, as a reply
  that finished while the app's page wasn't running is found on its return.
  `?thread` (11-20, chatgpt.com redesigned, signed in; from two saved pages, trimmed): `?gptin`'s composer (a form,
  data-chatgpt-composer) and none of the older markers. Each exchange is one turn, div[data-virtualized-turn] >
  [data-turn-key] > div[data-talvt-turn-state] ("complete" when done; "pending" and "streaming" before are this page's
  guesses), holding the person's message (div.block > h4[data-conversation-role=user].sr-only "You said:" + div
  [data-chatgpt-search-unit-key=…:user] with their files as resource cards and a picture as "User attachment", the words
  in [data-user-message-bubble]) and the reply (div.block > [data-chatgpt-search-unit-key=…:assistant] > h4
  [data-conversation-role=assistant] + [data-response-body] > [data-markdown-text-style=assistant-message]); a
  "Thinking" span[data-response-starting][role=status] before its first words; code as ChatGPT's widget
  (div[data-client-defined-widget=code_block] > div[data-chatgpt-copy-code].CodeBlock-… > div[data-code-block=true].Root-…
  > a "JavaScript" header (contenteditable=false, Copy code) and div.InlineCodePane-… > … > div.chatgpt-code-scrollport >
  pre.m-0 > code, drawn again as spans per line once written). While it writes, the form's Send is a plain
  button[type=button][aria-label=Stop]. The conversation's scroller is #log[role=region][aria-label=Conversation].
  A new chat is its home view (div[role=main] with "Where should we begin?" and section.group/home-suggestions); the first
  send shows the message there with "Thinking" and Stop, and 0.5 s later the page switches: the home view, frozen as it
  was (message, Thinking, a form with Stop), is kept at the body's start with display:none !important, as chatgpt.com
  keeps the page it left, and the conversation's turn is drawn anew. The header's "New chat" keeps the conversation the
  same way (hidden) and shows the home view again.
-->
<style>
  :root { color-scheme: light dark; --bg: #faf9f5; --fg: #1f1e1d; --line: #d8d5cc; --tile: #ece9e0; --you: #efece4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #262624; --fg: #f0eee6; --line: #45433f; --tile: #383733; --you: #30302d; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 16px/1.45 -apple-system, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { padding: 10px 14px; font-weight: 600; border-bottom: 1px solid var(--line); }
  #log { flex: 1; overflow-y: auto; padding: 12px 14px; }
  #log > li { list-style: none; }
  [data-testid="user-message"] { background: var(--you); border-radius: 14px; padding: 10px 12px; margin: 10px 0 10px 40px; white-space: pre-wrap; }
  .font-claude-response { margin: 10px 0; }
  pre { background: #1e1e1e; color: #e6e6e6; padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 12px; }
  .sent-file { display: inline-block; font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--tile); margin: 0 6px 6px 0; }
  .composer { border-top: 1px solid var(--line); padding: 8px 10px 12px; }
  .tiles:empty { display: none; }
  .tiles { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  [data-testid="file-thumbnail"] { display: inline-flex; align-items: center; gap: 6px; background: var(--tile); border-radius: 8px; padding: 6px 8px; font-size: 13px; }
  [data-testid="file-thumbnail"] button { border: 0; background: none; color: inherit; font-size: 15px; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .ProseMirror { flex: 1; min-height: 24px; max-height: 140px; overflow-y: auto; border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; outline: none; white-space: pre-wrap; }
  .ProseMirror:empty::before { content: "Reply to the stand-in…"; opacity: 0.5; }
  .row button { width: 40px; height: 40px; border-radius: 10px; border: 0; background: #c96442; color: white; font-size: 18px; }
  .row button:disabled { opacity: 0.4; }
  .toast { position: fixed; top: 10px; left: 10px; right: 10px; background: #fff; color: #111; border-radius: 12px; padding: 10px; box-shadow: 0 2px 10px #0003; }
  .file-card { display: inline-flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin: 6px 0; cursor: pointer; }
  .file-card small { opacity: 0.6; }
  .viewer { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 10; }
  .viewer header { display: flex; gap: 8px; align-items: center; }
  .viewer header span { flex: 1; }
  .viewer pre { flex: 1; margin: 0; border-radius: 0; overflow: auto; }
  .pasted { flex-direction: column; align-items: flex-start !important; max-width: 220px; }
  .pasted small, .pasted-card small { font-size: 10px; letter-spacing: 0.06em; opacity: 0.7; }
  .pasted pre, .pasted-card pre { max-height: 3.6em; overflow: hidden; margin: 2px 0 0; padding: 4px 6px; font-size: 9px; }
  .pasted-card { display: inline-flex; flex-direction: column; max-width: 220px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; margin: 0 0 6px; cursor: pointer; white-space: normal; }
  .ProseMirror pre { white-space: pre; margin: 4px 0; }
  .tools { display: flex; gap: 14px; align-items: center; padding: 8px 4px 0; font-size: 13px; opacity: 0.75; }
  .disclaimer { text-align: center; font-size: 12px; opacity: 0.6; padding: 6px 0 2px; }
  .viewer .linenumber { display: inline-block; width: 2.2em; opacity: 0.45; user-select: none; -webkit-user-select: none; }
  /* (?thread) */
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
  [data-user-message-bubble] { background: var(--you); border-radius: 14px; padding: 10px 12px; margin: 6px 0 10px 40px; white-space: pre-wrap; }
  .standin-home h1 { font: 400 26px/1.3 system-ui, sans-serif; text-align: center; margin: 18vh 0 12px; }
  .standin-home section button { display: block; width: 100%; text-align: left; font: 16px/1.3 system-ui; padding: 10px 6px; border: 0; background: none; color: inherit; opacity: 0.6; }
  [data-code-block] { border-radius: 8px; overflow: clip; margin: 8px 0; }
  [data-code-block] .code-head { display: flex; gap: 8px; align-items: center; padding: 6px 10px; font-size: 12px; background: #2a2a2a; color: #ccc; user-select: none; -webkit-user-select: none; }
  [data-code-block] .code-head button { width: 18px; height: 18px; border: 0; border-radius: 4px; background: #444; }
  [data-code-block] pre { margin: 0; border-radius: 0; }
  .group\/resource-card { display: inline-flex; gap: 6px; font-size: 12px; padding: 4px 8px; border-radius: 8px; background: var(--tile); margin: 0 6px 6px 0; position: relative; }
  .group\/resource-card button { position: absolute; inset: 0; opacity: 0; border: 0; }
  .sent-pic { width: 60px; height: 60px; border-radius: 8px; border: 1px solid var(--line); background: var(--tile); padding: 0; }
</style>
</head>
<body>
<header>Stand-in chat <button type="button" id="old-chat" style="float: right; font: 13px system-ui; border: 1px solid var(--line); border-radius: 8px; background: none; color: inherit;">Older chat</button></header>
<div id="log"></div>
<div class="composer">
  <div class="tiles" data-cds="MessageAttachments"></div>
  <div class="row">
    <div class="tiptap ProseMirror" contenteditable="true" data-testid="chat-input" data-cds="Editor" aria-label="Write your prompt to the stand-in"></div>
    <button type="button" aria-label="Send message" data-testid="chat-input-send" disabled>↑</button>
  </div>
</div>
<script>
(() => {
  const log = document.getElementById('log');
  const tiles = document.querySelector('.tiles');
  const ed = document.querySelector('.ProseMirror');
  const row = document.querySelector('.row');
  let send = row.querySelector('button');
  const files = [];
  const slow = location.search.includes('slow');
  // (?slowload: a picture that takes five seconds (node's slow server on 8378), so the page keeps loading long after
  // its message box is there, as claude.ai's does)
  if (location.search.includes('slowload')) { const i = new Image(); i.src = `http://localhost:8378/slow?${Date.now()}`; document.body.append(i); }
  const nostop = location.search.includes('nostop');
  const thread = /[?&]thread\b/.test(location.search); // (chatgpt.com's page of 11-20)
  if (location.search.includes('greet')) {
    // (`?greet=claude`: claude.ai's signed-in greeting (11-19), no heading: a div of display type holding its
    // starburst (an svg in a div) and the words in a span.select-none)
    const claudeGreet = /[?&]greet=claude\b/.test(location.search);
    const h = document.createElement(claudeGreet ? 'div' : 'h1');
    h.className = claudeGreet ? 'greet font-voice text-center' : 'greet';
    if (claudeGreet) {
      const star = document.createElement('div');
      star.style.cssText = 'display: inline-block; width: 30px; height: 30px; vertical-align: middle; margin-right: 8px;';
      star.innerHTML = '<svg viewBox="0 0 30 30" width="30" height="30"><path d="M15 2 L17 13 L28 15 L17 17 L15 28 L13 17 L2 15 L13 13 Z" fill="#d97757"/></svg>';
      const words = document.createElement('span');
      words.className = 'select-none';
      words.textContent = 'Hello, night owl';
      h.append(star, words);
    } else h.textContent = 'How can I help you today?';
    h.style.cssText = `font: ${claudeGreet ? '360 25.5px/1.3' : '600 26px/1.3'} Georgia, serif; text-align: center; margin: 22vh 0 0;`;
    log.append(h);
    const up = document.createElement('button');
    up.type = 'button';
    up.textContent = 'Upgrade plan';
    up.style.cssText = 'float: right; font: 13px system-ui; border: 1px solid var(--line); border-radius: 8px; background: none; color: inherit;';
    document.querySelector('header').append(up);
    new MutationObserver(() => { if (log.querySelector('[data-testid="user-message"]')) h.remove(); }).observe(log, { childList: true });
  }

  // (?suggest: ChatGPT's suggestions above the box, more of them once something is attached)
  if (/[?&]suggest\b/.test(location.search)) {
    const list = document.createElement('div');
    list.className = 'suggest';
    list.style.cssText = 'display: flex; flex-direction: column; gap: 2px; padding: 4px 14px;';
    const draw = () => {
      const rows = tiles.children.length ? ['Give me a short practical dialog…', 'Extract the text', 'Describe the image', 'Create a site to practice everyday…']
        : ['Create a site to practice everyday…', 'Give me a short practical dialog…'];
      if (list.getAttribute('data-rows') === rows.join('|')) return;
      list.setAttribute('data-rows', rows.join('|'));
      list.textContent = '';
      for (const t of rows) {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = t;
        b.style.cssText = 'text-align: left; font: 16px/1.3 system-ui; padding: 10px 6px; border: 0; background: none; color: inherit; opacity: 0.6;';
        list.append(b);
      }
    };
    draw();
    document.querySelector('.composer').before(list);
    new MutationObserver(draw).observe(tiles, { childList: true });
    new MutationObserver(() => { if (log.querySelector('[data-testid="user-message"], [data-message-role="user"]')) list.remove(); }).observe(log, { childList: true });
  }

  const late = location.search.includes('late');
  if (late) {
    setTimeout(() => {
      const t = document.createElement('div');
      t.className = 'tools';
      t.innerHTML = '<span>+</span><span>⚙︎</span><span style="flex:1"></span><button type="button" data-testid="model-selector-dropdown" data-cds="ModelSelector" aria-label="Model: Stand-in 5.5 High" style="font: inherit; border: 0; background: none; color: inherit; padding: 0">Stand-in 5.5 High</button><span>Manual</span>';
      document.querySelector('.composer').append(t);
    }, 1000);
    setTimeout(() => {
      const d = document.createElement('div');
      d.className = 'disclaimer';
      d.textContent = 'The stand-in is AI and can make mistakes.';
      document.querySelector('.composer').prepend(d);
    }, 1600);
    setTimeout(() => { document.querySelector('.composer').style.paddingBottom = '22px'; }, 2200);
  }
  const refresh = () => { send.disabled = !(ed.textContent.trim() || files.length || pastes.length); };
  ed.addEventListener('input', refresh);
  // (?gptdraft: one draft for the site, its text only, as chatgpt.com's)
  const gptdraft = /[?&]gptdraft\b/.test(location.search);
  if (gptdraft) {
    const ms = Number((location.search.match(/gptdraft=(\d+)/) || [])[1] || 800);
    const keep = () => { try { if (ed.textContent.trim()) localStorage.setItem('standin-draft', ed.textContent); else localStorage.removeItem('standin-draft'); } catch (e) {} };
    new MutationObserver(keep).observe(ed, { childList: true, subtree: true, characterData: true });
    const saved = (() => { try { return localStorage.getItem('standin-draft'); } catch (e) { return null; } })();
    if (saved) setTimeout(() => { ed.textContent = saved; refresh(); }, ms);
  }
  // (?draft: the box's attachments and text kept across a reload and put back a moment after the page loads, as
  // claude.ai keeps a draft)
  const draft = /[?&]draft\b/.test(location.search); // (not ?gptdraft's)
  const saveDraft = () => { if (draft) sessionStorage.setItem('draft', JSON.stringify({ text: ed.textContent, files })); };
  function addFile(name, text, type) {
    const entry = { name, text: text || '' };
    files.push(entry);
    // (?gptin's file tile is a span, as chatgpt.com's: span.group/composer-attachment; before 11-20 the stand-in drew a div)
    const tile = document.createElement(gptin && !(octane && /^image\//.test(type || '')) ? 'span' : 'div');
    const x = document.createElement('button');
    x.type = 'button';
    x.textContent = '×';
    x.addEventListener('click', () => { files.splice(files.indexOf(entry), 1); tile.remove(); refresh(); saveDraft(); });
    if (octane && /^image\//.test(type || '')) {
      entry.image = true;
      // (?octane, a picture, as chatgpt.com signed in draws it (11-19): a div[role=button].composer-attachment-surface
      // named only by its aria-label and its img's alt, no data-testid; a name used before gets "(n)" before its
      // extension, as its uploads do)
      const used = files.filter((f) => f !== entry && f.base === name).length;
      entry.base = name;
      if (used) { entry.name = name.replace(/(\.[^.]*)?$/, `(${used + 1})$1`); name = entry.name; }
      tile.className = 'composer-attachment-surface';
      tile.setAttribute('role', 'button');
      tile.setAttribute('aria-label', name);
      tile.style.cssText = 'position: relative; display: inline-block; width: 80px; height: 80px; border-radius: 10px; overflow: hidden; background: var(--tile);';
      // (the picture on a layer of its own, the remove button over the tile's corner, as chatgpt.com's)
      const layer = document.createElement('span');
      layer.className = 'composer-attachment-surface';
      layer.style.cssText = 'position: absolute; inset: 0; overflow: hidden; border-radius: 10px;';
      const img = document.createElement('img');
      img.alt = name;
      img.style.cssText = 'width: 100%; height: 100%; object-fit: cover;';
      layer.append(img);
      x.setAttribute('aria-label', `Remove ${name}`);
      x.style.cssText = 'position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: inherit;';
      tile.append(layer, x);
    } else if (gptin) {
      // (?gptin, a file, as chatgpt.com signed in draws it (11-19): span.group/composer-attachment > a surface with the
      // name in span.truncate and a button named by it; "Remove …" beside; a name used before gets "(n)")
      const used = files.filter((f) => f !== entry && f.base === name).length;
      entry.base = name;
      if (used) { entry.name = name.replace(/(\.[^.]*)?$/, `(${used + 1})$1`); name = entry.name; }
      tile.className = 'group/composer-attachment';
      tile.style.cssText = 'position: relative; display: inline-block; width: 120px; height: 120px; border-radius: 10px; background: var(--tile); font-size: 12px;';
      const surf = document.createElement('span');
      surf.className = 'composer-attachment-surface flex';
      surf.style.cssText = 'display: flex; flex-direction: column; justify-content: flex-end; height: 100%; padding: 6px; box-sizing: border-box;';
      const nm = document.createElement('span');
      nm.className = 'truncate';
      nm.style.cssText = 'overflow: hidden; text-overflow: ellipsis; white-space: nowrap;';
      nm.textContent = name;
      const open = document.createElement('button');
      open.type = 'button';
      open.className = 'composer-attachment-surface';
      open.setAttribute('aria-label', name);
      open.style.cssText = 'position: absolute; inset: 0; opacity: 0; border: 0;';
      surf.append(nm, open);
      x.setAttribute('aria-label', `Remove ${name}`);
      x.style.cssText = 'position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: inherit;';
      tile.append(surf, x);
    } else {
      // (as claude.ai signed in draws it (11-19): div[data-cds=MessageAttachmentsFile|Image][data-testid=file-thumbnail]
      // .group/tile > a Card whose body holds an sr-only name in a CardLink and the caption; Remove beside the card)
      tile.setAttribute('data-testid', 'file-thumbnail');
      tile.setAttribute('data-cds', /^image\//.test(type || '') || /\.png$/i.test(name) ? 'MessageAttachmentsImage' : 'MessageAttachmentsFile');
      tile.setAttribute('data-cds-attachment', '');
      tile.setAttribute('tabindex', '-1');
      tile.className = 'group/tile';
      const card = document.createElement('div');
      card.setAttribute('data-cds', 'Card');
      const body = document.createElement('div');
      body.setAttribute('data-cds-card-body', '');
      const link = document.createElement('span');
      link.setAttribute('data-cds', 'CardLink');
      link.setAttribute('role', 'button');

        const one = at === -1 ? null : [lines[at], lines[at].replace(/#[0-9a-f]{6}\b/i, `#b5179e${asked ? ` /* ${asked.trim()} */` : ''}`)];
        const search = /nomatch/i.test(text) ? ['  "css": "this line is not in the mod",'] : one ? [one[0]] : [lines[lines.length - 1]];
        const replace = one && !/nomatch/i.test(text) ? [one[1]] : [lines[lines.length - 1]];
        parts = [['p', 'Here are the changes:'], ['pre', [head, '<<<<<<< SEARCH', ...search, '=======', ...replace, '>>>>>>> REPLACE'].join('\n')]];
        const h = lines.findIndex((l) => /"hide": \[/.test(l));
        if (/two/i.test(text) && h !== -1) parts.push(['p', 'And the second change:'], ['pre', ['<<<<<<< SEARCH', lines[h], '=======', lines[h], '    "#standin-edited",', '>>>>>>> REPLACE'].join('\n')]);
        parts.push(['p', 'Add them, and tell me if anything looks wrong.']);
      }
    }
    else if (/broken/i.test(text)) parts = [['p', 'Try this:'], ['pre', `// ==WebMod==
// @name        Broken one
// @description Made by the stand-in chat${origin ? `\n// @match       ${origin}/*` : ''}
// @style
// ==/WebMod==
{ "css": ".feed-item h2 { color: red }", "hide": [ "#promo" `]];
    else {
      // ("called <Name>": the mod's name (a new mod, not an update of Calmer feed); "ask <words>": those words in its
      // CSS, so each quick ask's mod is code of its own)
      const called = (text.match(/called (\w+)/i) || [])[1];
      const asked = (text.match(/ask ([\w ]{1,40})/i) || [])[1];
      const id = (text.match(/\bmodid ([\w-]+)/i) || [])[1];
      const every = /everywhere/i.test(text);
      parts = [['p', 'Here is a style mod that does that. It only changes how the page looks.'],
        ['pre', modFor(every ? '*' : origin, called || 'Calmer feed', { css: `.feed-item h2 { color: #1f8a5b }${asked ? ` /* ${asked.trim()} */` : ''}`, hide: ['#promo-banner', '.feed-item.promoted'] }, id ? `\n// @id          ${id}` : '')]];
      if (/\blong\b/i.test(text)) for (let k = 1; k <= 12; k++) parts.splice(k, 0, ['p', `Step ${k}: here is a long explanation of what the mod does and why, so the reply takes a while to write on a slow connection. `.repeat(3)]);
      if (/two/i.test(text)) parts.push(['p', 'And a second one for the cookie box:'], ['pre', modFor(origin, 'No cookie box', asked ? { css: `/* ${asked.trim()} */`, hide: ['.cookie-consent'] } : { hide: ['.cookie-consent'] })]);
      parts.push(['p', 'Add it, and tell me if anything looks wrong.']);
    }
    // (?keep: the conversation kept by its address on the server (serve.js), as the service keeps it: the reply as it will end)
    if (keep) fetch(`/standin-conv${location.pathname}`, { method: 'POST', body: JSON.stringify({ text, parts }) }).catch(() => {});
    const answer = () => reply(parts, Number((text.match(/wait (\d+)/i) || [])[1] || 0), /\bwhole\b/i.test(text));
    if (fromHome) setTimeout(() => { leaveHome(); addTurn(text, sentFiles); answer(); }, 500);
    else answer();
  }
  // (a kept conversation's address starts k-, so it's known as one without the query, which the app drops on resume)
  const keep = /[?&]keep\b/.test(location.search) || /^\/(chat|c)\/k-/.test(location.pathname);

  // (?history: a long conversation whose older messages render late, as claude.ai draws them a little at a time: an
  // older exchange with an earlier version of the mod put at the top 1.5 s after the load, and another 2 s after
  // each reply ends. Their code is old: never offered (Tim, 11-17). ?reopen: the chat reopens a viewer by itself on
  // an old file 1 s after the load, with no tap)
  const older = location.search.includes('history');
  let olderN = 0;
  function addOlder() {
    olderN++;
    const u = document.createElement(octane ? 'li' : 'div');
    if (octane) u.setAttribute('data-message-role', 'user'); else u.setAttribute('data-testid', 'user-message');
    u.textContent = `an older ask (${olderN})`;
    const r = document.createElement(octane ? 'li' : 'div');
    if (octane) r.setAttribute('data-message-role', 'assistant'); else r.className = 'font-claude-response';
    const pre = document.createElement('pre');
    const code = document.createElement('code');
    code.textContent = modFor('http://localhost', 'Calmer feed', { css: `.feed-item h2 { color: #b2${olderN}2${olderN}2 }` });
    pre.append(code);
    r.append(Object.assign(document.createElement('p'), { textContent: 'An older version:' }), pre);
    log.prepend(u, r);
  }
  if (older) setTimeout(addOlder, 1500);
  if (location.search.includes('reopen')) setTimeout(() => openViewer('old-feed.js', modFor('http://localhost', 'Calmer feed', { css: '.feed-item h2 { color: #b22222 }' })), 1000);

  // (?oldchat, and the header's Older chat: an old conversation that loads in pieces, all into a history box above
  // anything sent here; scrolled to the top, an older exchange renders and the rest is drawn again)
  const oldMod = (n) => modFor('http://localhost', `Old feed ${n}`, { css: `.feed-item h2 { color: #3${n}3${n}a${n} }` });
  function oldExchange(n) {
    const u = document.createElement(octane ? 'li' : 'div');
    if (octane) u.setAttribute('data-message-role', 'user'); else u.setAttribute('data-testid', 'user-message');
    u.textContent = `an old ask (${n})`;
    const r = document.createElement(octane ? 'li' : 'div');
    if (octane) r.setAttribute('data-message-role', 'assistant'); else { r.className = 'font-claude-response'; r.setAttribute('data-is-streaming', 'false'); }
    return { u, r, fill: () => { const pre = document.createElement('pre'); const code = document.createElement('code'); code.textContent = oldMod(n); pre.append(code); r.append(Object.assign(document.createElement('p'), { textContent: `Old reply ${n}:` }), pre); } };
  }
  let oldGen = 0;
  function loadOld() {
    const gen = ++oldGen;
    let hist = log.querySelector('.history');
    if (!hist) { hist = document.createElement('div'); hist.className = 'history'; log.prepend(hist); }
    const later = (ms, f) => setTimeout(() => { if (gen === oldGen && hist.isConnected) f(); }, ms);
    const e2 = oldExchange(2), e1 = oldExchange(1);
    // (bottom first: the last reply's box, then its text in two goes, no streaming mark)
    later(300, () => { hist.append(e2.r); });
    later(450, () => { const pre = document.createElement('pre'); const code = document.createElement('code'); code.textContent = oldMod(2).slice(0, 60); pre.append(code); e2.r.append(Object.assign(document.createElement('p'), { textContent: 'Old reply 2:' }), pre); });
    later(900, () => { e2.r.querySelector('pre code').textContent = oldMod(2); });
    later(1300, () => { e1.fill(); hist.prepend(e1.r); });
    // (the person's messages late, each before its reply)
    later(2000, () => { e1.r.before(e1.u); e2.r.before(e2.u); });
    let rerendered = false;
    const up = () => {
      if (rerendered || gen !== oldGen) return;
      rerendered = true;
      const e0 = oldExchange(0);
      e0.fill();
      for (const n of [...hist.children]) n.replaceWith(n.cloneNode(true));
      hist.prepend(e0.u, e0.r);
    };
    window.__standinScrollUp = up;
    log.addEventListener('scroll', () => { if (log.scrollTop < 10 && hist.childElementCount >= 4) up(); });
  }
  document.getElementById('old-chat').addEventListener('click', () => {
    history.pushState({}, '', `/chat/old-${Math.random().toString(36).slice(2, 8)}${location.search}`);
    log.textContent = '';
    loadOld();
  });
  if (location.search.includes('oldchat')) loadOld();

  // (Claude's file viewer, as far as it matters here: over the whole chat, the message box left underneath)
  function openViewer(name, code) {
    const v = document.createElement('div');
    v.className = 'viewer';
    v.setAttribute('role', 'dialog');
    v.setAttribute('aria-modal', 'true');
    v.innerHTML = '<header><span></span><button type="button" aria-label="Download">Download</button><button type="button" aria-label="Close">✕</button></header><pre><code></code></pre>';
    v.querySelector('header span').textContent = name;
    const c = v.querySelector('code');
    code.split('\n').forEach((line, i) => { const n = document.createElement('span'); n.className = 'linenumber'; n.textContent = String(i + 1); c.append(n, `${line}\n`); });
    const routed = location.search.includes('viewerroute');
    const close = () => { v.remove(); if (routed && /\/files\//.test(location.pathname)) history.back(); };
    v.querySelector('[aria-label="Close"]').addEventListener('click', close);
    v.querySelector('[aria-label="Download"]').addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
      a.download = name;
      document.body.append(a);
      a.click();
      a.remove();
    });
    if (routed) {
      history.pushState({ viewer: name }, '', `${location.pathname.replace(/\/files\/.*$/, '')}/files/${name}${location.search}`);
      addEventListener('popstate', () => v.remove(), { once: true });
    }
    document.body.append(v);
  }

  // (?nested: a written code block drawn again as claude.ai's: pre.code-block__code > code.language-js > a code of line
  // numbers and the code in spans; =inline: each line's number at its start)
  const nested = (location.search.match(/[?&]nested(?:=(\w+))?/) || [])[0] ? ((location.search.match(/nested=(\w+)/) || [])[1] || 'column') : '';
  function drawNested(pre, text) {
    pre.className = 'code-block__code';
    pre.textContent = '';
    const code = document.createElement('code');
    code.className = 'language-js';
    code.style.whiteSpace = 'pre';
    const lines = text.replace(/\n$/, '').split('\n');
    const num = (i) => { const n = document.createElement('span'); n.className = 'linenumber react-syntax-highlighter-line-number'; n.style.cssText = 'display:inline-block;min-width:2.25em;padding-right:1em;text-align:right;user-select:none;-webkit-user-select:none;opacity:.5'; n.textContent = String(i + 1); return n; };
    if (nested === 'column') {
      const col = document.createElement('code');
      col.style.cssText = 'float:left;padding-right:10px';
      lines.forEach((_, i) => { const n = num(i); n.textContent += '\n'; col.append(n); });
      code.append(col);
    }
    lines.forEach((l, i) => {
      const row = document.createElement('span');
      if (nested === 'inline') row.append(num(i));
      const tok = document.createElement('span');
      tok.className = /^\s*\/\//.test(l) ? 'token comment' : 'token';
      tok.textContent = l;
      row.append(tok, '\n');
      code.append(row);
    });
    pre.append(code);
  }

  function reply(parts, seconds, whole) {
    const stop = document.createElement('button');
    stop.type = 'button';
    // (?thread: a plain "Stop", no testid, in the form where Send was)
    stop.setAttribute('aria-label', thread ? 'Stop' : gptin ? 'Stop streaming' : 'Stop response');
    if (gptin && !thread) stop.setAttribute('data-testid', 'stop-button');
    stop.textContent = '■';
    if (!nostop) send.replaceWith(stop);
    else send.disabled = true;
    let box, turn = null, thinking = null;
    if (thread) ({ box, turn, thinking } = threadReplyBox());
    else {
      box = document.createElement(octane ? 'li' : 'div');
      if (octane) box.setAttribute('data-message-role', 'assistant');
      else box.className = 'font-claude-response';
      if (!octane && location.pathname.startsWith('/c/')) { box.setAttribute('data-message-author-role', 'assistant'); box.setAttribute('data-message-id', `msg-${Date.now()}`); }
      if (!nostop && !octane) box.setAttribute('data-is-streaming', 'true');
      log.append(box);
    }
    const ended = () => { if (turn) turn.setAttribute('data-talvt-turn-state', 'complete'); else if (octane) box.setAttribute('data-message-complete', ''); };
    const steps = [];
    for (const [tag, t, label] of parts) {
      if (tag === 'card') {
        steps.push(() => {
          const card = document.createElement('div');
          card.className = 'file-card';
          card.setAttribute('role', 'button');
          card.tabIndex = 0;
          card.innerHTML = `<b></b><small>JS</small>`;
          card.querySelector('b').textContent = label;
          card.addEventListener('click', () => openViewer(label, t));
          box.append(card);
        });
        continue;
      }
      if (tag === 'a') {
        steps.push(() => { const card = document.createElement('div'); card.setAttribute('data-testid', 'file-card'); const a = document.createElement('a'); a.href = t; a.textContent = label; a.setAttribute('download', label); card.append('📄 ', a); box.append(card); });
        continue;
      }
      if (tag === 'pre' && cm) {
        // (a code editor's lines, as some chats show code: each line an element of its own)
        steps.push(() => { const e = document.createElement('div'); e.className = 'cm-editor'; const c = document.createElement('div'); c.className = 'cm-content'; for (const line of t.split('\n')) { const l = document.createElement('div'); l.className = 'cm-line'; l.textContent = line; c.append(l); } e.append(c); box.append(e); });
        continue;
      }
      const words = t.split(/(?<=\s)/);
      let into = null; // (not box.lastElementChild: TRIF puts its Add to TRIF button after a code block)
      let made = null;
      let widget = null;
      if (tag === 'pre' && thread) steps.push(() => { widget = codeWidget(); into = widget.code; box.append(widget.wrap); });
      else steps.push(() => { const n = document.createElement(tag); made = n; into = n; if (tag === 'pre') { into = document.createElement('code'); n.append(into); } box.append(n); });
      for (let i = 0; i < words.length; i += tag === 'pre' ? 6 : 2) {
        const chunk = words.slice(i, i + (tag === 'pre' ? 6 : 2)).join('');
        steps.push(() => { into.append(chunk); });
      }
      if (tag === 'pre' && nested) steps.push(() => drawNested(made, t));
      if (tag === 'pre' && thread) steps.push(() => highlight(widget, t));
    }
    // ("whole": every step at once, finished: no stop button, no streaming mark)
    if (whole) {
      if (!thread) box.setAttribute('data-is-streaming', 'false');
      if (!nostop) stop.replaceWith(send);
      if (thinking) thinking.remove();
      for (const f of steps) f();
      ended();
      refresh();
      return;
    }
    // ("wait N" in the message: the reply takes about N seconds, written a little at a time)
    const each = seconds ? Math.max(90, (seconds * 1000) / steps.length) : slow ? 220 : 90;
    let i = 0;
    let pauseAt = octane && !thread ? Math.floor(steps.length / 3) : -1;
    const tick = () => {
      // (?octane: a 3 s pause partway, with no stop button, as chatgpt.com's while it searches)
      if (i === pauseAt) { pauseAt = -1; const s2 = stop; s2.replaceWith(send); setTimeout(() => { send.replaceWith(s2); tick(); }, 3000); return; }
      if (i === 0 && thinking) thinking.remove();
      if (i < steps.length) { steps[i++](); log.scrollTop = log.scrollHeight; setTimeout(tick, each); return; }
      ended();
      if (nostop) { refresh(); return; }
      if (!thread) box.setAttribute('data-is-streaming', 'false');
      send = makeSend();
      stop.replaceWith(send);
      refresh();
      if (older) setTimeout(addOlder, 2000);
    };
    setTimeout(tick, thread ? 1200 : 600); // (?thread: "Thinking" a moment first)
  }
  // (?keep, 11-19, the mod matrix: a conversation opened again (the app killed mid-reply and launched again) shows its
  // exchanges finished, as claude.ai draws a conversation whose reply ended while nobody watched; kept by serve.js)
  if (/^\/(chat|c)\/k-/.test(location.pathname)) fetch(`/standin-conv${location.pathname}`).then((r) => r.json()).then((list) => { try {
    for (const x of list) {
      if (thread) { addTurn(x.text, []); reply(x.parts, 0, true); continue; }
      const u = document.createElement(octane ? 'li' : 'div');
      if (octane) u.setAttribute('data-message-role', 'user'); else u.setAttribute('data-testid', 'user-message');
      u.textContent = x.text;
      log.append(u);
      reply(x.parts, 0, true);
    }
  } catch (e) {} }).catch(() => {});

  // (11-20, TRIF's chats in a project of their own) ChatGPT's "Create project" (`?gptin` / `?thread`), as signed in on
  // 11-20 (read in the Simulator, nothing created): no address of its own; the side bar ("Show sidebar") has a Projects
  // section whose + (button[data-app-action-sidebar-project-create], "Add new project") opens a dialog: a form titled
  // h2 "Create project", "Project name" for input#chatgpt-project-name[name=project-name] (placeholder "Copenhagen
  // Trip"), a "Default memory" menu button, a type=submit "Create project" (disabled until there's a name), "Close
  // dialog". Create keeps the project in serve.js and goes to /g/g-p-<id>-<name>/project.
  const pEl = (tag, attrs = {}, text) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text) e.textContent = text; return e; };
  const btnCss = 'font: 13px system-ui; border: 1px solid var(--line); border-radius: 8px; background: none; color: inherit; margin-right: 8px;';
  if (octane) {
    const show = pEl('button', { type: 'button', 'aria-label': 'Show sidebar', 'aria-expanded': 'false', style: btnCss }, 'Menu');
    document.querySelector('header').prepend(show);
    let side = null;
    show.addEventListener('click', () => {
      if (side) { side.remove(); side = null; show.setAttribute('aria-expanded', 'false'); return; }
      side = pEl('aside', { id: 'standin-side', style: 'position: fixed; inset: 0 25vw 0 0; background: var(--bg); border-right: 1px solid var(--line); padding: 14px; z-index: 5;' });
      const head = pEl('div', { style: 'display: flex; justify-content: space-between; align-items: center; font-weight: 600;' });
      const plus = pEl('button', { type: 'button', 'aria-label': 'Add new project', 'data-app-action-sidebar-project-create': '', style: btnCss }, '+');
      head.append(pEl('span', {}, 'Projects'), plus);
      const close = pEl('button', { type: 'button', 'aria-label': 'Close sidebar', style: btnCss }, 'Close');
      close.addEventListener('click', () => show.click());
      side.append(close, head);
      plus.addEventListener('click', () => {
        const scrim = pEl('div', { style: 'position: fixed; inset: 0; background: #0006; z-index: 9; display: flex; align-items: center; justify-content: center;' });
        const dlg = pEl('div', { role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'cp-title', style: 'background: var(--bg); border-radius: 18px; padding: 16px; width: calc(100vw - 40px); box-sizing: border-box;' });
        const form = pEl('form');
        form.append(pEl('h2', { id: 'cp-title', style: 'margin: 0 0 12px; font-size: 20px;' }, 'Create project'), pEl('label', { for: 'chatgpt-project-name' }, 'Project name'));
        const input = pEl('input', { autocomplete: 'off', placeholder: 'Copenhagen Trip', id: 'chatgpt-project-name', type: 'text', name: 'project-name', style: 'display: block; width: 100%; box-sizing: border-box; font: inherit; padding: 10px; margin: 6px 0 12px;' });
        const submit = pEl('button', { type: 'submit', style: 'font: inherit; padding: 8px 14px; border-radius: 999px;' }, 'Create project');
        submit.disabled = true;
        const closeD = pEl('button', { type: 'button', 'aria-label': 'Close dialog', style: btnCss }, 'Close');
        form.append(input, pEl('p', { style: 'font-size: 14px; opacity: .7' }, 'Projects keep chats, files, and custom instructions in one place.'), pEl('button', { type: 'button', 'aria-haspopup': 'menu', style: btnCss }, 'Default memory'), submit, closeD);
        input.addEventListener('input', () => { submit.disabled = !input.value.trim(); });
        closeD.addEventListener('click', () => scrim.remove());
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          if (!input.value.trim()) return;
          const r = await fetch('/standin-project', { method: 'POST', body: JSON.stringify({ service: 'chatgpt', name: input.value.trim() }) });
          const { id } = await r.json();
          const slug = input.value.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
          location.assign(`/g/g-p-${id}-${slug}/project`);
        });
        dlg.append(form);
        scrim.append(dlg);
        document.body.append(scrim);
      });
      document.body.append(side);
      show.setAttribute('aria-expanded', 'true');
    });
  }

  // A project's page (11-20): claude.ai's /project/<id> has its instructions beside the chat ("Set project instructions"
  // → a dialog: "Set project instructions", a textarea, Cancel / "Save instructions", as its help pages describe; NOT
  // seen signed in: TRIF never opens Tim's projects). chatgpt.com's /g/g-p-<id>-<name>/project: "•••" (Open project
  // options) → a menu with "Project settings" (and "Delete project", which TRIF must never press) → a dialog with an
  // "Instructions" textarea and Save (its help page: ••• → Project settings; the dialog's markup is this page's guess).
  // Saved instructions are kept in serve.js (GET /standin-project/<id>: its `guide`).
  const projClaude = (location.pathname.match(/^\/project\/([\w-]+)\/?$/) || [])[1];
  const projGpt = (location.pathname.match(/^\/g\/g-p-([0-9a-f]{32})[\w-]*\/project\/?$/) || [])[1];
  const projId = projClaude || projGpt;
  if (projId) {
    const panel = pEl('section', { id: 'standin-project', style: 'padding: 8px 14px; border-bottom: 1px solid var(--line); font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;' });
    const title = pEl('strong', { style: 'flex: 1' }, 'Project');
    const state = pEl('span', { id: 'standin-guide-state', style: 'opacity: .7' }, '');
    panel.append(title, state);
    document.querySelector('header').after(panel);
    let saved = '';
    const paint = () => { state.textContent = saved ? 'Instructions set' : 'No instructions'; };
    fetch(`/standin-project/${projId}`).then((r) => r.ok ? r.json() : null).then((p) => { if (p) { title.textContent = p.name || 'Project'; saved = p.guide || ''; paint(); } }).catch(() => {});
    paint();
    const editor = (heading, label, saveWords) => {
      const scrim = pEl('div', { style: 'position: fixed; inset: 0; background: #0006; z-index: 9; display: flex; align-items: center; justify-content: center;' });
      const dlg = pEl('div', { role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'pi-title', style: 'background: var(--bg); border-radius: 18px; padding: 16px; width: calc(100vw - 32px); box-sizing: border-box;' });
      const area = pEl('textarea', { id: 'pi-text', rows: '8', placeholder: 'Think step by step…', 'aria-labelledby': 'pi-label', style: 'display: block; width: 100%; box-sizing: border-box; font: 14px system-ui; padding: 8px; margin: 6px 0 12px;' });
      area.value = saved;
      const save = pEl('button', { type: 'button', style: 'font: inherit; padding: 8px 14px; border-radius: 10px;' }, saveWords);
      const cancel = pEl('button', { type: 'button', style: btnCss }, 'Cancel');
      dlg.append(pEl('h2', { id: 'pi-title', style: 'margin: 0 0 8px; font-size: 18px;' }, heading), pEl('label', { id: 'pi-label', for: 'pi-text' }, label), area, cancel, save);
      cancel.addEventListener('click', () => scrim.remove());
      save.addEventListener('click', async () => {
        saved = area.value;
        await fetch(`/standin-project/${projId}/guide`, { method: 'POST', body: JSON.stringify({ guide: saved }) }).catch(() => {});
        paint();
        scrim.remove();
      });
      scrim.append(dlg);
      document.body.append(scrim);
    };
    if (projClaude) {
      const set = pEl('button', { type: 'button', style: btnCss }, 'Set project instructions');
      set.addEventListener('click', () => editor('Set project instructions', 'How should Claude respond in this project?', 'Save instructions'));
      panel.append(set);
    } else {
      const more = pEl('button', { type: 'button', 'aria-label': 'Open project options', 'aria-haspopup': 'menu', style: btnCss }, '•••');
      more.addEventListener('click', () => {
        const old = document.getElementById('standin-proj-menu');
        if (old) { old.remove(); return; }
        const menu = pEl('div', { role: 'menu', id: 'standin-proj-menu', style: 'position: fixed; right: 14px; top: 90px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; z-index: 8; display: flex; flex-direction: column;' });
        const settings = pEl('button', { type: 'button', role: 'menuitem', style: 'font: inherit; padding: 10px 14px; border: 0; background: none; color: inherit; text-align: left;' }, 'Project settings');
        const del = pEl('button', { type: 'button', role: 'menuitem', style: 'font: inherit; padding: 10px 14px; border: 0; background: none; color: #c00; text-align: left;' }, 'Delete project');
        settings.addEventListener('click', () => { menu.remove(); editor('Project settings', 'Instructions', 'Save'); });
        del.addEventListener('click', () => { menu.remove(); document.body.setAttribute('data-standin-deleted', 'pressed'); });
        menu.append(settings, del);
        document.body.append(menu);
      });
      panel.append(more);
    }
  }
})();
</script>
</body>
</html>
