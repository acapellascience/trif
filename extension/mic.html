<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Allow the microphone</title>
<link rel="icon" href="icons/robot-32.png">
<link rel="stylesheet" href="switch.css">
<!-- The page that asks for the microphone for TRIF's dictation (dictation.js): Chrome and Edge can't ask inside the
     side panel, so the panel's mic opens this beside the page the first time. It asks at once, says what happened,
     and closes itself once allowed. Words: dictation.js MIC_PAGE_WORDS, DICTATION_WORDS. -->
<style>
  :root {
    --bg: light-dark(#fbfbfa, #18181a); --card: light-dark(#ffffff, #212124); --text: light-dark(#1d1d1f, #ececee);
    --muted: light-dark(#6e6e73, #9a9aa0); --line: light-dark(#e4e4e1, #323236); --bad: light-dark(#c2512d, #f0866a);
    --ok: light-dark(#1f8a5b, #34d399);
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { width: min(100%, 440px); padding: 28px 28px 24px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); text-align: center; }
  img { width: 72px; height: 72px; }
  h1 { margin: 12px 0 6px; font-size: 19px; }
  p { margin: 6px 0; color: var(--muted); }
  #state { min-height: 1.5em; margin-top: 14px; color: var(--text); font-weight: 600; }
  #state.bad { color: var(--bad); font-weight: 500; }
  #state.ok { color: var(--ok); }
  .acts { display: flex; justify-content: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  button { padding: 6px 14px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--text); font: inherit; font-size: 13px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.go { border-color: transparent; background: var(--trif-green); color: #04291c; font-weight: 600; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <img src="icons/robot-128.png" alt="">
  <h1 id="title"></h1>
  <p id="lead"></p>
  <p id="where"></p>
  <p id="state" role="status" aria-live="polite"></p>
  <div class="acts">
    <button id="again" class="go" type="button" hidden></button>
    <button id="settings" type="button" hidden></button>
    <button id="close" type="button" hidden></button>
  </div>
</main>
<script type="module" src="mic.js"></script>
</body>
</html>
