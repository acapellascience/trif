# SPIKE (docs/WHOLE-BOX.md), branch whole-box only: the whole agent process in TRIF's own OS sandbox.
# Nothing is published, uploaded or signed; no secrets. Claude Code talks to a stand-in for Anthropic's API
# (no account, no paid call).
name: whole-box

on:
  push:
    branches: [whole-box]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whole-box-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Claude Code (npm's) in TRIF's Seatbelt box on a Mac: the probes, the loosest-settings run, and the
  # full side-panel run with every `trif` command, with and without the box.
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # (the user's own Claude Code: npm's newest, for today's sandbox; boxed runs use TRIF's pin, below)
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude --version; ls -la "$(command -v claude)"; file "$(readlink -f "$(command -v claude)")" || true
      - name: TRIF's pinned Claude Code, unit tests (a stand-in registry), and the Settings switch
        run: node --test tests/claudepin.test.js tests/wholebox-setting.test.js tests/claudetoken.test.js
      # TRIF's pinned Claude Code (helper/claude-code.json), installed as the helper does: from the npm
      # registry, its sha512 checked against the pin, Anthropic's signature checked.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/claude-pin
          key: claude-pin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('helper/claude-code.json') }}
      - name: Install TRIF's pinned Claude Code
        run: |
          node helper/lib/claudepin.js ensure "$RUNNER_TEMP/claude-pin"
          ls -la "$RUNNER_TEMP"/claude-pin/runtime/*/
          "$RUNNER_TEMP"/claude-pin/runtime/claude-code-*/claude --version
          echo "TRIF_TEST_CLAUDE_PIN_HOME=$RUNNER_TEMP/claude-pin" >> "$GITHUB_ENV"
      # (step 6: what the real pinned copy prints for `setup-token` without a terminal; never completed, no account)
      - name: Probe setup-token's output (TRIF's pinned Claude Code)
        continue-on-error: true
        timeout-minutes: 2
        run: node tests/whole-box/setup-token-probe.js "$(ls -d "$RUNNER_TEMP"/claude-pin/runtime/claude-code-*/)claude"
      - name: The box, and the loosest Claude Code in it
        run: node --test --test-timeout=300000 tests/whole-box.test.js
      - name: A side-panel run, every trif command (today's sandbox)
        run: TRIF_TEST_NO_REAL_CODEX=1 node --test --test-timeout=300000 --test-name-pattern="Claude Code" tests/run-sandbox.test.js
      # (TRIF_WHOLE_BOX=1: the test switches Settings' "Run chats in TRIF's full sandbox" on, config.json "wholeBox")
      - name: The same, the whole process in TRIF's box
        run: TRIF_WHOLE_BOX=1 TRIF_TEST_NO_REAL_CODEX=1 node --test --test-timeout=300000 --test-name-pattern="Claude Code" tests/run-sandbox.test.js
      # An organization's managed settings, for real (the runner's own /Library, with sudo; never anyone's
      # computer): Claude Code reads them whatever TRIF passes. The box must hold under them.
      - name: Managed settings that loosen everything, and the box
        run: |
          sudo mkdir -p "/Library/Application Support/ClaudeCode"
          echo '{"permissions":{"allow":["Read(//**)","Edit(//**)","Write(//**)","Bash(*)","Glob","Grep"],"defaultMode":"bypassPermissions","additionalDirectories":["/"]},"sandbox":{"enabled":false}}' | sudo tee "/Library/Application Support/ClaudeCode/managed-settings.json"
          TRIF_TEST_MANAGED=loosen node --test --test-timeout=300000 tests/whole-box.test.js
      - name: Managed settings that force Claude Code's own sandbox on, and the box
        run: |
          echo '{"sandbox":{"enabled":true,"failIfUnavailable":true,"allowUnsandboxedCommands":false}}' | sudo tee "/Library/Application Support/ClaudeCode/managed-settings.json"
          TRIF_TEST_MANAGED=sandbox-on node --test --test-timeout=300000 --test-name-pattern="managed" tests/whole-box.test.js
          sudo rm -f "/Library/Application Support/ClaudeCode/managed-settings.json"

  # claude.exe in an AppContainer (TRIF's fence launcher), exploration.
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Claude Code in an AppContainer
        run: node tests/whole-box/win-probe.js
      # An organization's managed settings, for real (the runner's own C:\Program Files; never anyone's
      # computer): every tool allowed, no asking, the whole disk. The box must hold under them.
      - name: Managed settings that loosen everything, and the box
        shell: pwsh
        env:
          WBX_SKIP_NO_LOOPBACK: '1'
        run: |
          New-Item -ItemType Directory -Force 'C:\Program Files\ClaudeCode' | Out-Null
          Set-Content -Path 'C:\Program Files\ClaudeCode\managed-settings.json' -Value '{"permissions":{"allow":["Read(//**)","Edit(//**)","Write(//**)","Bash(*)","Glob","Grep"],"defaultMode":"bypassPermissions","additionalDirectories":["C:\\"]}}'
          node tests/whole-box/win-probe.js
